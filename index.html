let filtroMov = null;
async function vMovimientos(m) {
  if (!filtroMov) { const [d, h] = rangoMes(); filtroMov = { desde: d, hasta: h, tipo: '', bodega: '', estado: '' }; }
  const f = filtroMov;
  m.innerHTML = `
    <div class="cabecera"><div><h1>Movimientos de inventario</h1><p>Entradas, salidas, traslados y ajustes</p></div>
      <div class="acciones">${puede('inventario.editar') ? Object.entries(TIPOS_MOV).map(([k, v], i) => `<a class="btn ${i ? 'sec' : ''}" href="#movimiento/nuevo-${k}">+ ${v}</a>`).join('') : ''}<button class="btn sec" id="b-csv">Exportar CSV</button></div></div>
    <div class="tarjeta">
      <form class="filtros" id="f-mov">
        <label class="campo">Desde<input type="date" name="desde" value="${f.desde}"></label>
        <label class="campo">Hasta<input type="date" name="hasta" value="${f.hasta}"></label>
        <label class="campo">Tipo<select name="tipo"><option value="">Todos</option>${Object.entries(TIPOS_MOV).map(([k, v]) => `<option value="${k}" ${f.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="campo">Bodega<select name="bodega">${opcionesBodega(bodegasAccesibles(false), f.bodega, 'Todas')}</select></label>
        <label class="campo">Estado<select name="estado"><option value="">Todos</option>${['borrador', 'aplicado', 'anulado'].map(e => `<option value="${e}" ${f.estado === e ? 'selected' : ''}>${e[0].toUpperCase() + e.slice(1)}</option>`).join('')}</select></label>
        <button class="btn sec">Filtrar</button>
      </form>
      <div class="envoltura" id="lista"><div class="cargando">Cargando…</div></div>
    </div>`;
  $('#f-mov').onsubmit = e => { e.preventDefault(); Object.assign(filtroMov, Object.fromEntries(new FormData(e.target))); vMovimientos(m); };
  let c = sb.from('inv_movimientos').select('*,inv_movimiento_lineas(costo_total)').gte('fecha', f.desde).lte('fecha', f.hasta)
    .order('fecha', { ascending: false }).order('id', { ascending: false });
  if (f.tipo) c = c.eq('tipo', f.tipo);
  if (f.estado) c = c.eq('estado', f.estado);
  let filas = await todas(c);
  if (f.bodega) filas = filas.filter(x => x.bodega_id === Number(f.bodega) || x.bodega_destino_id === Number(f.bodega));
  const total = x => x.inv_movimiento_lineas.reduce((s, l) => s + Math.abs(Number(l.costo_total || 0)), 0);
  const est = { borrador: 'e-borrador', aplicado: 'e-contabilizado', anulado: 'e-anulado' };
  $('#lista').innerHTML = filas.length ? `<table>
    <thead><tr><th>Documento</th><th>Fecha</th><th>Tipo</th><th>Bodega</th><th>Concepto</th><th class="num">Valor C$</th><th>Estado</th></tr></thead>
    <tbody>${filasLargas(filas, x => `<tr class="clic" onclick="location.hash='movimiento/${x.id}'"><td>${docMov(x)}</td><td>${fecha(x.fecha)}</td><td>${TIPOS_MOV[x.tipo]}</td>
      <td>${esc(bodegaPorId(x.bodega_id)?.codigo)}${x.bodega_destino_id ? ' → ' + esc(bodegaPorId(x.bodega_destino_id)?.codigo) : ''}</td>
      <td>${esc(x.concepto)}${x.referencia ? ` <span class="muted">· ${esc(x.referencia)}</span>` : ''}</td>
      <td class="num">${x.estado === 'borrador' && x.tipo !== 'entrada' ? '<span class="muted">al aplicar</span>' : fmt(total(x))}</td><td><span class="etiqueta ${est[x.estado]}">${x.estado}</span></td></tr>`, 7)}</tbody></table>`
    : '<div class="vacio">No hay movimientos con estos filtros.</div>';
  $('#b-csv').onclick = () => csv(`movimientos_${f.desde}_${f.hasta}.csv`, [['Documento', 'Fecha', 'Tipo', 'Bodega', 'Destino', 'Concepto', 'Referencia', 'Valor C$', 'Estado'],
    ...filas.map(x => [docMov(x), x.fecha, TIPOS_MOV[x.tipo], bodegaPorId(x.bodega_id)?.nombre, bodegaPorId(x.bodega_destino_id)?.nombre || '', x.concepto, x.referencia || '', total(x).toFixed(2), x.estado])]);
}

async function vMovimiento(m, arg) {
  await cargarCatalogos();
  let M;
  if (String(arg || '').startsWith('nuevo')) {
    const tipo = (arg.split('-')[1] in TIPOS_MOV) ? arg.split('-')[1] : 'entrada';
    if (!puede('inventario.editar')) { m.innerHTML = '<div class="aviso error">Su rol no permite registrar movimientos de inventario.</div>'; return; }
    const bods = bodegasAccesibles();
    if (!bods.length) { m.innerHTML = '<div class="aviso error">No tiene bodegas asignadas. Pida al administrador que le asigne una en Usuarios.</div>'; return; }
    const par = await q(sb.from('inv_parametros').select('*').eq('id', 1).maybeSingle()) || {};
    M = { estado: 'nuevo', tipo, fecha: hoy(), bodega_id: bods[0].id, bodega_destino_id: '', concepto: '', referencia: '', centro_costo_id: '',
      cuenta_contrapartida_id: { entrada: par.cuenta_entrada_id, salida: par.cuenta_salida_id, ajuste: par.cuenta_ajuste_id }[tipo] || '', lineas: [{}, {}] };
  } else {
    const x = await q(sb.from('inv_movimientos').select('*').eq('id', Number(arg)).maybeSingle());
    if (!x) { m.innerHTML = '<div class="aviso error">El movimiento no existe o no tiene acceso a su bodega.</div>'; return; }
    const ls = await q(sb.from('inv_movimiento_lineas').select('*').eq('movimiento_id', x.id).order('orden'));
    M = { ...x, lineas: ls.map(l => ({ ...l, costo: l.costo_total !== null && Number(l.cantidad) ? r2(Number(l.costo_total) / Math.abs(Number(l.cantidad)) * 1e4) / 1e4 : '' })) };
  }
  const editable = puede('inventario.editar') && (M.estado === 'nuevo' || M.estado === 'borrador');
  return editable ? formMovimiento(m, M) : verMovimiento(m, M);
}

function verMovimiento(m, M) {
  const tot = M.lineas.reduce((s, l) => s + Math.abs(Number(l.costo_total || 0)), 0);
  const cta = cuentaPorId(M.cuenta_contrapartida_id), cc = cache.centros.find(c => c.id === M.centro_costo_id);
  m.innerHTML = `
    <div class="cabecera no-imprimir"><div><h1>${TIPOS_MOV[M.tipo]} ${docMov(M)}</h1><p><a href="#movimientos">← Volver a movimientos</a></p></div>
      <div class="acciones"><button class="btn sec" onclick="print()">Imprimir</button>
        ${puede('inventario.anular') && M.estado === 'aplicado' ? '<button class="btn peligro" id="b-anular">Anular</button>' : ''}</div></div>
    <div class="tarjeta">
      <div class="reporte-titulo"><img src="logo.png" alt="Amigos for Christ"><h2>${TIPOS_MOV[M.tipo]} de inventario ${docMov(M)}</h2>
        <div class="muted">${fecha(M.fecha)} · <span class="etiqueta ${M.estado === 'anulado' ? 'e-anulado' : 'e-contabilizado'}">${M.estado}</span></div></div>
      ${M.estado === 'anulado' ? `<div class="aviso error">Anulado el ${fecha(M.fecha_anulacion)} por ${esc(nombrePerfil(M.anulado_por))}. Motivo: ${esc(M.motivo_anulacion)}</div>` : ''}
      <p><b>${M.tipo === 'traslado' ? 'De:' : 'Bodega:'}</b> ${esc(bodegaPorId(M.bodega_id)?.nombre)}${M.bodega_destino_id ? ` &nbsp; <b>A:</b> ${esc(bodegaPorId(M.bodega_destino_id)?.nombre)}` : ''}
        &nbsp; <b>Concepto:</b> ${esc(M.concepto)}${M.referencia ? ` &nbsp; <b>Referencia:</b> ${esc(M.referencia)}` : ''}</p>
      ${cta ? `<p class="muted" style="margin-top:-6px">Contrapartida: ${esc(etiquetaCuenta(cta))}${cc ? ' · Centro: ' + esc(cc.nombre) : ''}</p>` : ''}
      <div class="envoltura"><table>
        <thead><tr><th>Producto</th><th class="num">Cantidad</th><th>Unidad</th><th>Descripción</th><th class="num">Costo unit. C$</th><th class="num">Total C$</th></tr></thead>
        <tbody>${M.lineas.map(l => { const p = productoPorId(l.producto_id);
          return `<tr><td>${esc(etiquetaProducto(p))}</td><td class="num">${fmtQ(l.cantidad)}</td><td>${esc(codUnidad(l.unidad_id))}${Number(l.factor) !== 1 ? ` <span class="muted">(${fmtQ(l.cantidad_base)} ${esc(codUnidad(p?.unidad_id))})</span>` : ''}</td>
          <td>${esc(l.descripcion)}</td><td class="num">${l.costo_total !== null ? fmt(Math.abs(l.costo_total / l.cantidad)) : ''}</td><td class="num">${l.costo_total !== null ? fmt(Math.abs(l.costo_total)) : ''}</td></tr>`; }).join('')}
          <tr class="total"><td colspan="5">Total</td><td class="num">${fmt(tot)}</td></tr></tbody>
      </table></div>
      <div class="meta">
        <span>Elaborado: ${esc(nombrePerfil(M.creado_por))} · ${fechaHora(M.creado_en)}</span>
        ${M.aplicado_en ? `<span>Aplicado: ${esc(nombrePerfil(M.aplicado_por))} · ${fechaHora(M.aplicado_en)}</span>` : ''}
        ${puede('contabilidad.ver') && M.asiento_id ? `<span class="no-imprimir"><a href="#asiento/${M.asiento_id}">Ver asiento contable</a></span>` : ''}
        ${puede('contabilidad.ver') && M.asiento_anulacion_id ? `<span class="no-imprimir"><a href="#asiento/${M.asiento_anulacion_id}">Ver asiento de anulación</a></span>` : ''}
        ${M.estado === 'aplicado' && !M.asiento_id ? '<span>Sin asiento contable (no hubo valor que registrar)</span>' : ''}
      </div>
      <div class="meta" style="margin-top:40px;justify-content:space-around"><span>______________________<br>Entregado por</span><span>______________________<br>Recibido por</span></div>
    </div>`;
  if ($('#b-anular')) $('#b-anular').onclick = () => abrirModal(
    `<h2>Anular ${docMov(M)}</h2><p class="muted">Se revierten las existencias y se registra el asiento contable de reversión en la fecha indicada. No se puede deshacer.</p>
     <div class="rejilla"><label class="campo">Fecha de la anulación<input type="date" name="fecha" value="${hoy() < M.fecha ? M.fecha : hoy()}" min="${M.fecha}" required></label>
     <label class="campo ancho">Motivo<textarea name="motivo" rows="3" required></textarea></label></div>`,
    async d => { await q(sb.rpc('anular_movimiento', { p_id: M.id, p_motivo: $('[name=motivo]', d).value, p_fecha: $('[name=fecha]', d).value })); avisar('Movimiento anulado'); await cargarCatalogos(); mostrar(); },
    { textoGuardar: 'Anular movimiento' });
}

function formMovimiento(m, M) {
  const nuevo = M.estado === 'nuevo', T = M.tipo;
  const conCosto = T === 'entrada' || T === 'ajuste', conCta = T !== 'traslado';
  m.innerHTML = `
    <div class="cabecera"><div><h1>${nuevo ? 'Nueva' : ''} ${TIPOS_MOV[T].toLowerCase()}${nuevo ? '' : ' en borrador'}</h1><p><a href="#movimientos">← Volver a movimientos</a></p></div>
      <div class="acciones">
        ${nuevo ? '' : '<button class="btn peligro" id="b-eliminar">Eliminar borrador</button>'}
        <button class="btn sec" id="b-guardar">Guardar borrador</button>
        <button class="btn" id="b-aplicar">Aplicar</button>
      </div></div>
    ${nuevo ? `<div class="pestanas">${Object.entries(TIPOS_MOV).map(([k, v]) => `<a href="#movimiento/nuevo-${k}" class="${k === T ? 'activo' : ''}">${v}</a>`).join('')}</div>` : ''}
    <div class="tarjeta"><div class="rejilla">
      <label class="campo">Fecha<input type="date" id="m-fecha" value="${M.fecha}"></label>
      <label class="campo">${T === 'traslado' ? 'Bodega de origen' : 'Bodega'}<select id="m-bod">${opcionesBodega(bodegasAccesibles(), M.bodega_id)}</select></label>
      ${T === 'traslado' ? `<label class="campo">Bodega de destino<select id="m-dest">${opcionesBodega(cache.bodegas.filter(b => b.activa), M.bodega_destino_id, '— Elija —')}</select></label>` : ''}
      <label class="campo">Referencia<input id="m-ref" value="${esc(M.referencia)}" placeholder="${T === 'entrada' ? 'Factura del proveedor' : T === 'salida' ? 'Requisa, proyecto…' : 'Documento'}"></label>
      <label class="campo ancho">Concepto<input id="m-concepto" value="${esc(M.concepto)}" placeholder="${{ entrada: 'Compra a …, donación de …', salida: 'Materiales para el proyecto …', traslado: 'Envío de materiales a …', ajuste: 'Conteo físico del …' }[T]}"></label>
      ${conCta ? `<label class="campo" style="grid-column:span 2">Cuenta contable de contrapartida<input id="m-cta" list="dl-ctas" value="${esc(etiquetaCuenta(cuentaPorId(M.cuenta_contrapartida_id)))}"><span class="muted" style="font-weight:400">${{ entrada: 'A quién se le debe o con qué se pagó (Proveedores, Bancos…)', salida: 'A qué gasto o programa se carga', ajuste: 'Cuenta de sobrantes y faltantes' }[T]}</span></label>` : ''}
      ${T === 'salida' || T === 'ajuste' ? `<label class="campo">Centro de costo<select id="m-cc">${opcionesCentro(M.centro_costo_id)}</select></label>` : ''}
    </div>${datalistCuentas('dl-ctas', true)}</div>
    <div class="tarjeta">
      ${T === 'ajuste' ? '<div class="aviso">Escriba la diferencia encontrada: positiva si sobra (entra) y negativa si falta (sale). Use "Contado" para calcularla a partir del conteo físico.</div>' : ''}
      <div class="envoltura"><table class="lineas">
        <thead><tr><th class="c-cuenta">Producto</th><th style="width:110px">Unidad</th><th class="num" style="width:110px">Existencia</th>
          ${T === 'ajuste' ? '<th class="num c-monto">Contado</th>' : ''}<th class="num c-monto">Cantidad</th>
          ${conCosto ? `<th class="num c-monto">Costo unit. C$${T === 'ajuste' ? ' (opcional)' : ''}</th><th class="num c-monto">Total C$</th>` : ''}<th>Descripción</th><th></th></tr></thead>
        <tbody id="cuerpo"></tbody>
      </table></div>
      ${datalistProductos('dl-prod')}
      <div class="acciones" style="margin-top:10px"><button class="btn sec chico" id="b-linea">+ Agregar línea</button></div>
      <div class="totales" id="totales"></div>
    </div>`;

  let exist = {};
  const cargarExist = async () => {
    const b = Number($('#m-bod').value);
    const rows = await todas(sb.from('existencias').select('*').eq('bodega_id', b)).catch(() => []);
    exist = {}; rows.forEach(r => exist[r.producto_id] = Number(r.cantidad));
    pintar();
  };
  const factorDe = l => { const p = productoPorId(l.producto_id); return unidadesDe(p).find(u => u.unidad_id === Number(l.unidad_id))?.factor || 1; };
  const pintar = () => {
    $('#cuerpo').innerHTML = M.lineas.map((l, i) => {
      const p = productoPorId(l.producto_id), fac = factorDe(l), ex = p ? (exist[p.id] || 0) / fac : null;
      return `<tr data-i="${i}">
        <td><input list="dl-prod" data-f="producto" value="${esc(etiquetaProducto(p))}" placeholder="Código o nombre"></td>
        <td><select data-f="unidad_id">${p ? unidadesDe(p).map(u => `<option value="${u.unidad_id}" ${u.unidad_id === Number(l.unidad_id || p.unidad_id) ? 'selected' : ''}>${esc(codUnidad(u.unidad_id))}${u.factor !== 1 ? ' ×' + fmtQ(u.factor) : ''}</option>`).join('') : '<option value="">—</option>'}</select></td>
        <td class="num muted">${p ? fmtQ(Math.round(ex * 10000) / 10000) : ''}</td>
        ${T === 'ajuste' ? `<td><input class="monto" data-f="contado" inputmode="decimal" placeholder="${p ? fmtQ(ex) : ''}"></td>` : ''}
        <td><input class="monto" data-f="cantidad" inputmode="decimal" value="${l.cantidad ? fmtQ(l.cantidad) : ''}"></td>
        ${conCosto ? `<td><input class="monto" data-f="costo" inputmode="decimal" value="${l.costo !== '' && l.costo !== undefined && l.costo !== null ? l.costo : ''}"></td>
          <td class="num" data-sub>${l.cantidad && l.costo ? fmt(num(l.cantidad) * num(l.costo)) : ''}</td>` : ''}
        <td><input data-f="descripcion" value="${esc(l.descripcion)}"></td>
        <td><button class="btn sec chico" data-quitar title="Quitar">✕</button></td></tr>`;
    }).join('');
    totales();
  };
  const totales = () => {
    const n = M.lineas.filter(l => l.producto_id && num(l.cantidad)).length;
    const t = M.lineas.reduce((s, l) => s + (conCosto && l.costo !== '' && l.costo !== undefined ? num(l.cantidad) * num(l.costo) : 0), 0);
    $('#totales').innerHTML = `<span>Líneas: <b>${n}</b></span>${T === 'entrada' ? `<span>Total: <b>C$ ${fmt(t)}</b></span>` : `<span class="muted">El costo se calcula al promedio al aplicar</span>`}`;
  };
  const cuerpo = $('#cuerpo');
  cuerpo.addEventListener('input', e => {
    const tr = e.target.closest('tr'), l = M.lineas[Number(tr.dataset.i)], f = e.target.dataset.f;
    if (f === 'cantidad' || f === 'costo') {
      l[f] = e.target.value;
      const v = num(e.target.value);
      e.target.classList.toggle('invalido', isNaN(v) || (f === 'costo' && v < 0) || (f === 'cantidad' && T !== 'ajuste' && v < 0));
      const sub = $('[data-sub]', tr); if (sub) sub.textContent = num(l.cantidad) && l.costo !== '' ? fmt(num(l.cantidad) * num(l.costo)) : '';
      totales();
    } else if (f === 'contado') {
      const p = productoPorId(l.producto_id); if (!p) return;
      const dif = Math.round((num(e.target.value) - (exist[p.id] || 0) / factorDe(l)) * 10000) / 10000;
      l.cantidad = e.target.value === '' ? '' : dif;
      $('[data-f=cantidad]', tr).value = e.target.value === '' ? '' : fmtQ(dif);
      totales();
    } else if (f === 'descripcion') l.descripcion = e.target.value;
  });
  cuerpo.addEventListener('change', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const l = M.lineas[Number(tr.dataset.i)], f = e.target.dataset.f;
    if (f === 'producto') {
      const p = productoDesdeTexto(e.target.value);
      if (!p && e.target.value.trim()) { avisar('Elija un producto activo de la lista', 'error'); e.target.classList.add('invalido'); return; }
      l.producto_id = p?.id || null; l.unidad_id = p?.unidad_id || null;
      if (p && T === 'entrada' && (l.costo === '' || l.costo === undefined) && Number(p.costo_promedio)) l.costo = Number(p.costo_promedio);
      pintar();
      $(`tr[data-i="${tr.dataset.i}"] [data-f=cantidad]`)?.focus();
    } else if (f === 'unidad_id') { l.unidad_id = Number(e.target.value); pintar(); }
  });
  cuerpo.addEventListener('click', e => {
    if (!e.target.closest('[data-quitar]')) return;
    M.lineas.splice(Number(e.target.closest('tr').dataset.i), 1); if (!M.lineas.length) M.lineas.push({});
    pintar();
  });
  $('#b-linea').onclick = () => { M.lineas.push({}); pintar(); $(`tr[data-i="${M.lineas.length - 1}"] [data-f=producto]`).focus(); };
  $('#m-bod').onchange = cargarExist;

  const datos = () => {
    let cta = null;
    if (conCta) { const c = cuentaDesdeTexto($('#m-cta').value); if (!c) throw new Error('Elija una cuenta contable de contrapartida que acepte movimientos'); cta = c.id; }
    return {
      id: nuevo ? null : M.id, tipo: T, fecha: $('#m-fecha').value, bodega_id: Number($('#m-bod').value),
      bodega_destino_id: T === 'traslado' ? Number($('#m-dest').value) || null : null,
      concepto: $('#m-concepto').value, referencia: $('#m-ref').value, cuenta_contrapartida_id: cta,
      centro_costo_id: $('#m-cc') ? Number($('#m-cc').value) || null : null,
      lineas: M.lineas.filter(l => l.producto_id || num(l.cantidad)).map(l => ({ producto_id: l.producto_id, unidad_id: l.unidad_id, cantidad: num(l.cantidad),
        costo: conCosto && l.costo !== '' && l.costo !== undefined && l.costo !== null ? num(l.costo) : null, descripcion: l.descripcion || '' }))
    };
  };
  const guardar = async (aplicar, b) => {
    if ($$('#cuerpo .invalido').length) return avisar('Hay campos marcados en rojo por corregir', 'error');
    let p; try { p = datos(); } catch (e) { return avisar(e.message, 'error'); }
    if (!p.concepto.trim()) return avisar('Escriba el concepto', 'error');
    if (!p.lineas.length) return avisar('Agregue al menos un producto', 'error');
    if (p.lineas.some(l => !l.producto_id)) return avisar('Hay líneas con cantidad pero sin producto', 'error');
    if (p.lineas.some(l => !l.cantidad)) return avisar('Hay productos sin cantidad', 'error');
    if (T === 'entrada' && p.lineas.some(l => l.costo === null)) return avisar('Indique el costo unitario de cada producto', 'error');
    if (aplicar && !confirm('Al aplicar se mueven las existencias y se registra el asiento contable. Después solo se podrá anular. ¿Continuar?')) return;
    b.disabled = true;
    try {
      const id = await q(sb.rpc('guardar_movimiento', { p, p_aplicar: aplicar }));
      avisar(aplicar ? 'Movimiento aplicado' : 'Borrador guardado');
      await cargarCatalogos();
      if (location.hash === `#movimiento/${id}`) mostrar(); else location.hash = `movimiento/${id}`;
    } catch (e) { fallo(e); } finally { b.disabled = false; }
  };
  $('#b-guardar').onclick = e => guardar(false, e.currentTarget);
  $('#b-aplicar').onclick = e => guardar(true, e.currentTarget);
  if ($('#b-eliminar')) $('#b-eliminar').onclick = async () => {
    if (!confirm('¿Eliminar este borrador?')) return;
    try { await q(sb.rpc('eliminar_movimiento', { p_id: M.id })); avisar('Borrador eliminado'); location.hash = 'movimientos'; } catch (e) { fallo(e); }
  };
  cargarExist();
}

        <tbody>${filas.map(f => `<tr class="${f.movimiento_id ? 'clic' : 'grupo'}" ${f.movimiento_id ? `onclick="location.hash='movimiento/${f.movimiento_id}'"` : ''}>

function modalProducto(m, p = null) {
  let pres = p ? cache.presentaciones.filter(x => x.producto_id === p.id).map(x => ({ unidad_id: x.unidad_id, factor: Number(x.factor) })) : [];
  const optsU = sel => cache.unidades.map(u => `<option value="${u.id}" ${u.id === Number(sel) ? 'selected' : ''}>${esc(u.codigo)} · ${esc(u.nombre)}</option>`).join('');
  const d = abrirModal(`<h2>${p ? 'Editar producto' : 'Nuevo producto'}</h2>
    <div class="rejilla">
      <label class="campo">Código<input name="codigo" value="${esc(p?.codigo || '')}" required></label>
      <label class="campo">Categoría<select name="categoria_id"><option value="">—</option>${cache.categorias.map(c => `<option value="${c.id}" ${c.id === p?.categoria_id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label>
      <label class="campo ancho">Nombre<input name="nombre" value="${esc(p?.nombre || '')}" required></label>
      <label class="campo">Unidad base<select name="unidad_id" required>${optsU(p?.unidad_id || cache.unidades.find(u => u.codigo === 'UND')?.id)}</select></label>
      <label class="campo">Existencia mínima<input name="stock_minimo" inputmode="decimal" value="${p ? fmtQ(p.stock_minimo) : '0'}"></label>
      <label class="campo ancho">Descripción<input name="descripcion" value="${esc(p?.descripcion || '')}"></label>
      <label class="campo chk"><input type="checkbox" name="activo" ${!p || p.activo ? 'checked' : ''}> Activo</label>
    </div>
    <h3 style="margin-top:14px">Presentaciones</h3>
    <p class="muted" style="font-size:13px;margin:4px 0 8px">Otras unidades en que se compra o despacha. Ej.: Caja = 24 unidades; Quintal = 100 libras.</p>
    <div id="pres"></div><button type="button" class="btn sec chico" id="b-pres">+ Agregar presentación</button>`,
    async d => {
      const f = new FormData($('form', d));
      const v = { codigo: String(f.get('codigo')).trim(), nombre: String(f.get('nombre')).trim(), categoria_id: Number(f.get('categoria_id')) || null,
        unidad_id: Number(f.get('unidad_id')), stock_minimo: num(f.get('stock_minimo')) || 0, descripcion: String(f.get('descripcion')).trim() || null, activo: f.get('activo') === 'on' };
      const ps = pres.filter(x => x.unidad_id && num(x.factor) > 0);
      if (ps.some(x => Number(x.unidad_id) === v.unidad_id)) { avisar('Una presentación no puede usar la unidad base', 'error'); return false; }
      if (new Set(ps.map(x => Number(x.unidad_id))).size !== ps.length) { avisar('Hay dos presentaciones con la misma unidad', 'error'); return false; }
      let id = p?.id;
      if (p) await q(sb.from('productos').update(v).eq('id', p.id));
      else id = (await q(sb.from('productos').insert(v).select('id').single())).id;
      await q(sb.from('producto_presentaciones').delete().eq('producto_id', id));
      if (ps.length) await q(sb.from('producto_presentaciones').insert(ps.map(x => ({ producto_id: id, unidad_id: Number(x.unidad_id), factor: num(x.factor) }))));
      avisar('Producto guardado'); vProductos(m);
    }, { extraIzq: p ? '<button type="button" class="btn peligro" id="b-borrar">Eliminar</button>' : '' });
  const pintarPres = () => {
    $('#pres', d).innerHTML = pres.map((x, i) => `<div class="filtros" style="margin-bottom:6px" data-i="${i}">
      <label class="campo">Unidad<select data-f="unidad_id"><option value="">—</option>${optsU(x.unidad_id)}</select></label>
      <label class="campo">Equivale a (unidades base)<input data-f="factor" inputmode="decimal" value="${x.factor || ''}"></label>
      <button type="button" class="btn sec chico" data-q>✕</button></div>`).join('');
  };
  $('#pres', d).addEventListener('input', e => { const i = Number(e.target.closest('[data-i]').dataset.i); pres[i][e.target.dataset.f] = e.target.value; });
  $('#pres', d).addEventListener('change', e => { const i = Number(e.target.closest('[data-i]').dataset.i); pres[i][e.target.dataset.f] = e.target.value; });
  $('#pres', d).addEventListener('click', e => { if (e.target.closest('[data-q]')) { pres.splice(Number(e.target.closest('[data-i]').dataset.i), 1); pintarPres(); } });
  $('#b-pres', d).onclick = () => { pres.push({ unidad_id: '', factor: '' }); pintarPres(); };
  pintarPres();
  if (p) $('#b-borrar', d).onclick = async () => {
    if (!confirm(`¿Eliminar el producto ${p.codigo}?`)) return;
    try { await q(sb.from('productos').delete().eq('id', p.id)); d.close(); avisar('Producto eliminado'); vProductos(m); } catch (e) { fallo(e); }
  };
}

function numeroALetras(valor, moneda = 'NIO') {
  const U = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE', 'DIEZ', 'ONCE', 'DOCE', 'TRECE', 'CATORCE', 'QUINCE',
    'DIECISÉIS', 'DIECISIETE', 'DIECIOCHO', 'DIECINUEVE', 'VEINTE', 'VEINTIÚN', 'VEINTIDÓS', 'VEINTITRÉS', 'VEINTICUATRO', 'VEINTICINCO',
    'VEINTISÉIS', 'VEINTISIETE', 'VEINTIOCHO', 'VEINTINUEVE'];
  const D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  const C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];
  const cientos = x => {
    if (!x) return ''; if (x === 100) return 'CIEN';
    const c = Math.floor(x / 100), r = x % 100;
    const dec = r < 30 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '');
    return [C[c], dec].filter(Boolean).join(' ');
  };
  const total = Math.round(Math.abs(Number(valor) || 0) * 100), ent = Math.floor(total / 100), cent = total % 100;
  const mm = Math.floor(ent / 1e6), mi = Math.floor((ent % 1e6) / 1000), re = ent % 1000;
  const partes = [];
  if (mm) partes.push(mm === 1 ? 'UN MILLÓN' : cientos(mm) + ' MILLONES');
  if (mi) partes.push(mi === 1 ? 'MIL' : cientos(mi) + ' MIL');
  if (re) partes.push(cientos(re));
  const txt = partes.join(' ') || 'CERO';
  const de = mm && !mi && !re ? ' DE' : '';
  const unidad = moneda === 'USD' ? (ent === 1 ? 'DÓLAR' : 'DÓLARES') : (ent === 1 ? 'CÓRDOBA' : 'CÓRDOBAS');
  return `${txt}${de} ${unidad} CON ${String(cent).padStart(2, '0')}/100`;
}
const simbolo = mon => mon === 'USD' ? 'US$' : 'C$';
const ESTADOS_CHEQUE = { borrador: 'Borrador', por_aprobar: 'Por aprobar', aprobado: 'Aprobado', anulado: 'Anulado' };

    $$('[data-k]', d).forEach(i => { const k = i.dataset.k, sub = i.dataset.s; const val = i.tagName === 'SELECT' ? i.value : Number(i.value); if (sub) { G[k] = G[k] || {}; G[k][sub] = val; } else G[k] = val; });
    return G;
  }
  $('#b-prueba', d).onclick = () => {
    const G = leerFormato(d), mon = $('[name=moneda]', d).value;
    d.close();
    imprimirHTML(htmlCheque(G, { fecha: fecha(hoy()), beneficiario: 'NOMBRE DEL BENEFICIARIO DE PRUEBA', monto: fmt(12345.67), letras: numeroALetras(12345.67, mon) }, true), paginaCheque(G));
    setTimeout(() => d.showModal(), 800);
  };
}

// ============================================================
// Cheque: elaborar, aprobar, imprimir

async function vCheque(m, arg) {
  await cargarCatalogos();
  let C, L = [];
  if (arg === 'nuevo' || !arg) {
    if (!puede('bancos.emitir')) { m.innerHTML = '<div class="aviso error">Su rol no permite elaborar cheques.</div>'; return; }
    const cb = cache.bancos.find(b => b.activa);
    if (!cb) { m.innerHTML = '<div class="aviso error">No hay cuentas bancarias activas. Configure una en Cuentas bancarias.</div>'; return; }
    C = { estado: 'nuevo', cuenta_bancaria_id: cb.id, fecha: hoy(), beneficiario: '', monto: '', concepto: '', moneda: cb.moneda, tipo_cambio: '' };
    L = [{}, {}];
  } else {
    C = await q(sb.from('cheques').select('*').eq('id', Number(arg)).maybeSingle());
    if (!C) { m.innerHTML = '<div class="aviso error">El cheque no existe o no tiene acceso.</div>'; return; }
    L = await q(sb.from('cheque_lineas').select('*').eq('cheque_id', C.id).order('orden'));
  }
  const editable = puede('bancos.emitir') && (C.estado === 'nuevo' || C.estado === 'borrador');
  return editable ? formCheque(m, C, L) : verCheque(m, C, L);
}

function pasosCheque(c) {
  const pasos = [['Elaborado', c.creado_en, c.creado_por], ['Enviado', c.enviado_en], ['Aprobado', c.aprobado_en, c.aprobado_por], ['Impreso', c.impreso_en], ['Cobrado', c.cobrado ? c.fecha_cobro : null]];
  if (c.estado === 'anulado') pasos.push(['Anulado', c.anulado_en, c.anulado_por]);
  return `<div style="display:flex;gap:0;flex-wrap:wrap;margin:6px 0 4px">${pasos.map(([t, f, u], i) => `
    <div style="flex:1;min-width:110px;text-align:center;position:relative;opacity:${f ? 1 : .45}">
      <div style="width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:13px;font-weight:800;
        background:${f ? (t === 'Anulado' ? 'var(--error)' : 'var(--azul)') : 'var(--borde)'};color:#fff;transition:all .4s ${i * 0.08}s">${f ? '✓' : i + 1}</div>
      <div style="font-weight:700;font-size:13px;color:var(--titulo)">${t}</div>
      <div class="muted" style="font-size:11.5px">${f ? (String(f).length > 10 ? fechaHora(f) : fecha(f)) : ''}${u ? '<br>' + esc(nombrePerfil(u)) : ''}</div>
    </div>`).join('')}</div>`;
}

let paletaItems = [], paletaSel = 0, paletaT = null;
function abrirPaleta() {
  if (!yo) return;
  const p = $('#paleta'); p.classList.add('abierta');
  const i = $('#paleta-q'); i.value = ''; i.focus();

function cerrarPaleta() { $('#paleta').classList.remove('abierta'); }
async function buscarPaleta(txt) {
  const t = txt.trim().toLowerCase();
  const pantallas = menuVisible().filter(x => x[0] !== 'g').map(([r, n]) => ({ g: 'Pantallas', t: n, h: '#' + r, ic: r }));
  const acciones = [
    puede('bancos.emitir') && { g: 'Acciones', t: 'Nuevo cheque', h: '#cheque/nuevo', ic: 'cheques' },
    editor() && { g: 'Acciones', t: 'Nuevo asiento', h: '#asiento/nuevo', ic: 'asientos' },
    puede('inventario.editar') && { g: 'Acciones', t: 'Nueva entrada a bodega', h: '#movimiento/nuevo-entrada', ic: 'existencias' },
    puede('inventario.editar') && { g: 'Acciones', t: 'Nueva salida de bodega', h: '#movimiento/nuevo-salida', ic: 'movimientos' },
    puede('inventario.editar') && { g: 'Acciones', t: 'Nuevo traslado entre bodegas', h: '#movimiento/nuevo-traslado', ic: 'movimientos' },
    puede('planilla.editar') && { g: 'Acciones', t: 'Nueva planilla', h: '#planilla/nueva', ic: 'planillas' },
    puede('planilla.ver') && { g: 'Acciones', t: 'Calcular liquidación', h: '#liquidacion', ic: 'colaboradores' },
    puede('activos.editar') && { g: 'Acciones', t: 'Registrar depreciación del mes', h: '#depreciacion/nueva', ic: 'depreciacion' },
    { g: 'Acciones', t: document.documentElement.dataset.tema === 'oscuro' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro', fn: () => { aplicarTema(document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro'); mostrar(); }, ic: 'roles' }
  ].filter(Boolean);
  const coincide = x => !t || x.t.toLowerCase().includes(t);
  let items = [...acciones.filter(coincide), ...pantallas.filter(coincide)];
  if (t.length >= 2) {
    items.push(...cache.productos.filter(p => (p.codigo + ' ' + p.nombre).toLowerCase().includes(t)).slice(0, 5).map(p => ({ g: 'Productos', t: etiquetaProducto(p), h: '#kardex/' + p.id, ic: 'productos', d: 'Kardex' })));
    items.push(...cache.empleados.filter(e => [e.nombre, e.correo, e.cargo, e.cedula].join(' ').toLowerCase().includes(t)).slice(0, 5).map(e => ({ g: 'Colaboradores', t: e.nombre, h: '#colaborador/' + e.id, ic: 'colaboradores', d: e.cargo || '' })));
    if (puede('contabilidad.ver')) items.push(...cache.cuentas.filter(c => (c.codigo + ' ' + c.nombre).toLowerCase().includes(t)).slice(0, 5).map(c => ({ g: 'Cuentas contables', t: etiquetaCuenta(c), h: '#mayor/' + c.id, ic: 'mayor', d: 'Libro mayor' })));
  }
  pintarPaleta(items);
  clearTimeout(paletaT);
  if (t.length < 2) return;
  paletaT = setTimeout(async () => {
    const lim = t.replace(/[,()%*"\\]/g, ' ');
    const extra = [];
    try {
      const tareas = [];
      if (puede('bancos.ver')) tareas.push(q(sb.from('cheques').select('id,numero,beneficiario,monto,moneda,estado').or(`beneficiario.ilike."*${lim}*",concepto.ilike."*${lim}*"`).order('id', { ascending: false }).limit(6))
        .then(r => r.forEach(c => extra.push({ g: 'Cheques', t: `${c.numero ? 'Nº ' + c.numero + ' · ' : ''}${c.beneficiario}`, d: `${simbolo(c.moneda)} ${fmt(c.monto)} · ${ESTADOS_CHEQUE[c.estado]}`, h: '#cheque/' + c.id, ic: 'cheques' }))));
      if (puede('contabilidad.ver')) tareas.push(q(sb.from('asientos').select('id,numero,fecha,concepto').or(`concepto.ilike."*${lim}*",referencia.ilike."*${lim}*"`).order('fecha', { ascending: false }).limit(5))
        .then(r => r.forEach(a => extra.push({ g: 'Asientos', t: a.concepto, d: `${a.numero ? 'Nº ' + a.numero + ' · ' : ''}${fecha(a.fecha)}`, h: '#asiento/' + a.id, ic: 'asientos' }))));
      if (puede('inventario.ver')) tareas.push(q(sb.from('inv_movimientos').select('id,tipo,anio,numero,concepto,fecha').or(`concepto.ilike."*${lim}*",referencia.ilike."*${lim}*"`).order('fecha', { ascending: false }).limit(5))
        .then(r => r.forEach(x => extra.push({ g: 'Movimientos de inventario', t: x.concepto, d: `${docMov(x)} · ${fecha(x.fecha)}`, h: '#movimiento/' + x.id, ic: 'movimientos' }))));
      await Promise.all(tareas);
    } catch {}
    if ($('#paleta-q').value.trim().toLowerCase() === t && extra.length) pintarPaleta([...items, ...extra]);
  }, 250);
}
function pintarPaleta(items) {
  paletaItems = items; paletaSel = 0;
  let g = '';
  $('#paleta-res').innerHTML = items.length ? items.map((x, i) => {
    const cab = x.g !== g ? `<div class="gr">${esc(x.g)}</div>` : ''; g = x.g;
    return `${cab}<div class="it ${i === 0 ? 'sel' : ''}" data-i="${i}">${icono(x.ic, 16)}<span>${esc(x.t)}</span>${x.d ? `<small>${esc(x.d)}</small>` : ''}</div>`;
  }).join('') : '<div class="vacio">Sin resultados</div>';
}
function ejecutarPaleta(i) {
  const x = paletaItems[i]; if (!x) return;
  cerrarPaleta();
  if (x.fn) x.fn(); else if (location.hash === x.h) mostrar(); else location.hash = x.h.slice(1);
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#paleta').classList.contains('abierta') ? cerrarPaleta() : abrirPaleta(); return; }
  if (!$('#paleta').classList.contains('abierta')) return;
  if (e.key === 'Escape') { cerrarPaleta(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    paletaSel = (paletaSel + (e.key === 'ArrowDown' ? 1 : -1) + paletaItems.length) % Math.max(paletaItems.length, 1);
    $$('#paleta .it').forEach(el => el.classList.toggle('sel', Number(el.dataset.i) === paletaSel));
    $(`#paleta .it[data-i="${paletaSel}"]`)?.scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') { e.preventDefault(); ejecutarPaleta(paletaSel); }
});
document.addEventListener('DOMContentLoaded', () => {});
$('#paleta-q').addEventListener('input', e => buscarPaleta(e.target.value));
$('#paleta-res').addEventListener('click', e => { const it = e.target.closest('.it'); if (it) ejecutarPaleta(Number(it.dataset.i)); });
$('#paleta').addEventListener('click', e => { if (e.target.id === 'paleta') cerrarPaleta(); });

// ---------- Planillas ----------
function siguienteQuincena() {
  const [y, mo, d] = hoy().split('-').map(Number), p = n => String(n).padStart(2, '0'), ult = new Date(y, mo, 0).getDate();
  return d <= 15 ? [`${y}-${p(mo)}-01`, `${y}-${p(mo)}-15`] : [`${y}-${p(mo)}-16`, `${y}-${p(mo)}-${ult}`];
}

function modalNuevaPlanilla() {
  const [d, h] = siguienteQuincena();
  const dlg = abrirModal(`<h2>Nueva planilla</h2>
    <p class="muted" style="font-size:13px;margin:0 0 10px">Entran los colaboradores activos con ese tipo de pago y salario registrado. Después puede agregar o quitar.</p>

      <label class="campo">Hasta<input type="date" name="hasta" value="${h}" required></label>
      <label class="campo">Fecha de pago<input type="date" name="fecha_pago" value="${h}"></label>
      <label class="campo ancho">Descripción (opcional)<input name="descripcion" placeholder="Planilla quincenal del …"></label>
    </div>
    <div class="aviso" id="nota-agui" hidden style="margin:10px 0 0">Aguinaldo: del 1 de diciembre al 30 de noviembre, un mes de salario por año trabajado y proporcional por días (año de 360 días).
      Entran todos los colaboradores activos. No lleva INSS, INATEC ni IR. Se paga a más tardar el 10 de diciembre.</div>`, async dl => {
      const p = Object.fromEntries(new FormData($('form', dl)));
      const id = await q(sb.rpc('guardar_planilla', { p }));
      avisar('Planilla creada y calculada'); location.hash = 'planilla/' + id;
    }, { textoGuardar: 'Crear y calcular' });
  $('[name=tipo]', dlg).onchange = ev => {
    const [y, mo] = $('[name=desde]', dlg).value.split('-'), ult = new Date(Number(y), Number(mo), 0).getDate();
    $('#nota-agui', dlg).hidden = ev.target.value !== 'aguinaldo';
    if (ev.target.value === 'aguinaldo') { const ya = hoy().slice(0, 4); $('[name=desde]', dlg).value = `${ya - 1}-12-01`; $('[name=hasta]', dlg).value = `${ya}-11-30`; $('[name=fecha_pago]', dlg).value = `${ya}-12-10`; }
    else if (ev.target.value === 'mensual') { $('[name=desde]', dlg).value = `${y}-${mo}-01`; $('[name=hasta]', dlg).value = `${y}-${mo}-${ult}`; $('[name=fecha_pago]', dlg).value = `${y}-${mo}-${ult}`; }

  };
}

async function enviarColillas(id, token) {
  avisar('Enviando las colillas por correo… puede tardar un par de minutos');
  try {
    const r = await fetch(CONFIG.marcajeApi, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: 'enviarColillas', args: [id, token] }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || 'La app de marcaje no pudo enviar los correos');
    const d = r.data || {};
    avisar(`Colillas enviadas: ${d.enviados || 0}${d.errores ? ` · ${d.errores} con error` : ''}${d.sin_correo ? ` · ${d.sin_correo} sin correo` : ''}`, d.errores ? 'error' : undefined);

  }

}

}

  m.innerHTML = `
    <div class="cabecera"><div><h1>Vacaciones</h1><p>15 días por cada 6 meses (2.5 por mes) más los días extra que aprueba Administración</p></div>
      <div class="acciones">${ed ? '<button class="btn" id="b-mov">+ Registrar movimiento</button>' : ''}</div></div>
    <div class="pestanas">${Object.entries(NOMBRES).map(([k, v]) => `<a href="#" data-p="${k}" class="${pestVac === k ? 'activo' : ''}">${v}<span class="n">${cuenta[k]}</span></a>`).join('')}</div>
    <div class="tarjeta"><div class="envoltura">${cuerpo}</div></div>`;
  $$('[data-p]').forEach(a => a.onclick = e => { e.preventDefault(); pestVac = a.dataset.p; vVacaciones(m); });
  $$('[data-emp]').forEach(tr => tr.onclick = () => { pestVac = 'movs'; vVacaciones(m); });
  $$('[data-ok]').forEach(b => b.onclick = async () => { try { await q(sb.rpc('revisar_dia_extra', { p_id: Number(b.closest('tr').dataset.x), p_aprobar: true })); avisar('Día extra aprobado: se suma a vacaciones'); actualizarInsignias(); vVacaciones(m); } catch (e) { fallo(e); } });
  $$('[data-no]').forEach(b => b.onclick = () => abrirModal('<h2>Rechazar día extra</h2><label class="campo">Motivo<textarea name="motivo" rows="3" required></textarea></label>',
    async d => { await q(sb.rpc('revisar_dia_extra', { p_id: Number(b.closest('tr').dataset.x), p_aprobar: false, p_motivo: $('[name=motivo]', d).value })); avisar('Día extra rechazado'); actualizarInsignias(); vVacaciones(m); }, { textoGuardar: 'Rechazar' }));
  $$('[data-anular]').forEach(b => b.onclick = () => abrirModal('<h2>Anular movimiento</h2><label class="campo">Motivo<textarea name="motivo" rows="3" required></textarea></label>',
    async d => { await q(sb.rpc('anular_vacaciones', { p_id: Number(b.closest('tr').dataset.x), p_motivo: $('[name=motivo]', d).value })); avisar('Movimiento anulado'); vVacaciones(m); }, { textoGuardar: 'Anular' }));
  if ($('#b-mov')) $('#b-mov').onclick = () => abrirModal(`<h2>Registrar movimiento de vacaciones</h2><div class="rejilla">
      <label class="campo ancho">Colaborador<select name="empleado_id">${opcionesEmpleado()}</select></label>
      <label class="campo">Tipo<select name="tipo"><option value="tomadas">Vacaciones tomadas</option><option value="dia_extra">Día extra trabajado (lo aprueba Administración)</option><option value="saldo_inicial">Saldo inicial (traído de AG Planilla)</option><option value="ajuste">Ajuste (+ o −)</option></select></label>
      <label class="campo">Días<input name="dias" inputmode="decimal" value="1"></label>
      <label class="campo">Fecha<input type="date" name="fecha" value="${hoy()}"></label>
      <label class="campo ancho">Descripción<input name="descripcion" placeholder="Motivo o detalle"></label></div>`,
    async d => {
      const p = Object.fromEntries(new FormData($('form', d))); p.dias = num(p.dias);
      if (!p.dias || isNaN(p.dias)) { avisar('Indique los días', 'error'); return false; }
      await q(sb.rpc('registrar_vacaciones', { p })); avisar(p.tipo === 'dia_extra' ? 'Día extra registrado; espera aprobación de Administración' : 'Movimiento registrado'); actualizarInsignias(); vVacaciones(m);
    });
}

// ---------- Configuración de planilla e integración con marcaje ----------
async function vConfigPlanilla(m) {
  await cargarCatalogos();
  const [pars, tramos, conceptos, claves] = await Promise.all([
    q(sb.from('planilla_parametros').select('*').order('vigente_desde', { ascending: false })),
    q(sb.from('ir_tramos').select('*').order('vigente_desde', { ascending: false }).order('desde')),
    q(sb.from('conceptos_planilla').select('*').order('tipo').order('nombre')),
    q(sb.from('integracion_claves').select('*').order('id', { ascending: false }))
  ]);
  const vig = pars.find(p => p.vigente_desde <= hoy()) || pars.at(-1);
  const vigIR = tramos.find(t => t.vigente_desde <= hoy())?.vigente_desde;
  const tr = tramos.filter(t => t.vigente_desde === vigIR);
  const cta = id => esc(etiquetaCuenta(cuentaPorId(id)));
  const urlApi = CONFIG.url + '/rest/v1/rpc/recibir_marcaje';
  m.innerHTML = `
    <div class="cabecera"><div><h1>Configuración de planilla</h1><p>Tasas legales con fecha de vigencia, tabla del IR, conceptos y conexión con la app de marcaje</p></div></div>
    <div class="aviso">Confirme estas tasas con el contador. Si la ley cambia, agregue una nueva vigencia en lugar de editar la actual: las planillas anteriores conservan sus cálculos.</div>
    <div class="graficos" style="align-items:start">
      <div class="tarjeta"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Tasas vigentes desde ${fecha(vig?.vigente_desde)}</h2><button class="btn sec chico" id="b-vig">+ Nueva vigencia</button></div>
        ${vig ? `<table><tbody>
          <tr><td>INSS laboral</td><td class="num"><b>${fmtQ(vig.inss_laboral)}%</b></td></tr>
          <tr><td>INSS patronal</td><td class="num"><b>${fmtQ(vig.inss_patronal)}%</b></td></tr>
          <tr><td>INATEC</td><td class="num"><b>${fmtQ(vig.inatec)}%</b></td></tr>
          <tr><td>Techo mensual del INSS</td><td class="num">${vig.techo_inss ? 'C$ ' + fmt(vig.techo_inss) : 'Sin techo'}</td></tr>
          <tr><td>Vacaciones por mes</td><td class="num">${fmtQ(vig.dias_vacaciones_mes)} días</td></tr>
          <tr><td>Sueldos (gasto)</td><td>${cta(vig.cuenta_salarios_id)}</td></tr>
          <tr><td>Aportes patronales (gasto)</td><td>${cta(vig.cuenta_patronal_id)}</td></tr>
          <tr><td>INSS por pagar</td><td>${cta(vig.cuenta_inss_pagar_id)}</td></tr>
          <tr><td>IR por pagar</td><td>${cta(vig.cuenta_ir_pagar_id)}</td></tr>
          <tr><td>INATEC por pagar</td><td>${cta(vig.cuenta_inatec_pagar_id)}</td></tr>
          <tr><td>Salarios por pagar</td><td>${cta(vig.cuenta_neto_pagar_id)}</td></tr>
          <tr><td>Prestaciones (aguinaldo, vacaciones e indemnización)</td><td>${cta(vig.cuenta_prestaciones_id)}</td></tr>
          <tr><td>Plan de ahorro: aporte de AFC</td><td class="num"><b>${fmtQ(vig.ahorro_afc_pct)}%</b> · retiro cada ${vig.ahorro_anios_retiro} años</td></tr>
          <tr><td>Plan de ahorro por pagar</td><td>${cta(vig.cuenta_ahorro_pagar_id)}</td></tr>
          <tr><td>Aporte al plan de ahorro (gasto)</td><td>${cta(vig.cuenta_aporte_ahorro_id)}</td></tr></tbody></table>` : '<p>No hay parámetros.</p>'}
        ${pars.length > 1 ? `<p class="muted" style="font-size:12.5px;margin:8px 0 0">Vigencias anteriores: ${pars.filter(p => p !== vig).map(p => fecha(p.vigente_desde)).join(', ')}</p>` : ''}</div>
      <div class="tarjeta"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Tabla anual del IR</h2><button class="btn sec chico" id="b-ir">Editar</button></div>
        <table><thead><tr><th class="num">Desde (C$)</th><th class="num">Hasta (C$)</th><th class="num">Base</th><th class="num">%</th></tr></thead>
        <tbody>${tr.map(t => `<tr><td class="num">${fmt(t.desde)}</td><td class="num">${t.hasta ? fmt(t.hasta) : 'en adelante'}</td><td class="num">${fmt(t.base)}</td><td class="num">${fmtQ(t.porcentaje)}%</td></tr>`).join('')}</tbody></table>
        <p class="muted" style="font-size:12.5px;margin:8px 0 0">Vigente desde ${fecha(vigIR)}. La base del período (salario − INSS) se proyecta al año, se aplica la tabla y se divide entre 24 o 12.</p></div>
    </div>
    <div class="tarjeta"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Conceptos de ingreso y deducción</h2><button class="btn sec chico" id="b-conc">+ Concepto</button></div>
      <div class="envoltura"><table><thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>INSS</th><th>IR</th><th>Cuenta contable</th><th></th></tr></thead>
      <tbody>${conceptos.map(c => `<tr class="clic" data-c="${c.id}"><td>${esc(c.codigo)}</td><td>${esc(c.nombre)}</td><td>${c.tipo === 'ingreso' ? 'Ingreso' : 'Deducción'}</td>
        <td>${c.tipo === 'ingreso' ? (c.afecta_inss ? 'Sí' : 'No') : ''}</td><td>${c.tipo === 'ingreso' ? (c.afecta_ir ? 'Sí' : 'No') : ''}</td>
        <td>${c.cuenta_id ? cta(c.cuenta_id) : '<span class="muted">Sueldos y salarios</span>'}</td><td>${c.activo ? '' : '<span class="etiqueta e-anulado">Inactivo</span>'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="tarjeta" id="integracion"><h2>Conexión con la app de marcaje</h2>
      <p style="margin:6px 0 12px">El marcaje envía cada día los colaboradores, las marcas y los permisos. Las vacaciones aprobadas se descuentan del saldo y cada marca en sábado, domingo o feriado llega como <b>día extra</b> para que Administración lo apruebe.</p>
      <ol style="margin:0 0 12px;padding-left:20px;line-height:1.7">
        <li>Cree una clave aquí y cópiela; solo se muestra una vez.</li>
        <li>En el proyecto de Apps Script del marcaje agregue el archivo <code>PuenteContabilidad.gs</code> (está en la carpeta <code>integracion</code> del repositorio de Contabilidad AFC).</li>
        <li>En Configuración del proyecto → Propiedades del script agregue <code>AFC_ANON</code> = <code>${esc(CONFIG.anonKey)}</code> (la clave pública de la app) y <code>AFC_CLAVE</code> = la clave creada.</li>
        <li>Ejecute <code>enviarAContabilidad</code> una vez para autorizar y <code>activarEnvioDiario</code> para dejarlo automático.</li></ol>
      <div class="acciones" style="margin-bottom:12px"><button class="btn" id="b-clave">+ Crear clave</button></div>
      ${claves.length ? `<table><thead><tr><th>Nombre</th><th>Creada</th><th>Último envío</th><th>Resultado</th><th></th></tr></thead><tbody>
        ${claves.map(k => `<tr><td>${esc(k.nombre)}</td><td>${fechaHora(k.creado_en)}</td><td>${k.ultimo_uso ? fechaHora(k.ultimo_uso) : '<span class="muted">Nunca</span>'}</td>
          <td class="muted">${k.ultimo_resultado ? `${k.ultimo_resultado.empleados} colaboradores · ${k.ultimo_resultado.marcas} marcas · ${k.ultimo_resultado.permisos} permisos · ${k.ultimo_resultado.dias_extra_nuevos} días extra nuevos` : ''}</td>
          <td>${k.activa ? `<button class="btn sec chico" data-desac="${k.id}">Desactivar</button>` : '<span class="etiqueta e-anulado">Desactivada</span>'}</td></tr>`).join('')}</tbody></table>` : ''}
    </div>`;
  const ctaSel = (name, sel, tipos) => `<select name="${name}">${cache.cuentas.filter(c => c.acepta_movimientos && c.activa && tipos.includes(c.tipo)).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(etiquetaCuenta(c))}</option>`).join('')}</select>`;
  $('#b-vig').onclick = () => abrirModal(`<h2>Nueva vigencia de tasas</h2><p class="muted" style="font-size:13px;margin:0 0 10px">Se aplica a las planillas cuyo período termina desde esa fecha.</p><div class="rejilla">
      <label class="campo">Vigente desde<input type="date" name="vigente_desde" value="${hoy()}" required></label>
      <label class="campo">INSS laboral %<input name="inss_laboral" inputmode="decimal" value="${vig?.inss_laboral ?? 7}"></label>
      <label class="campo">INSS patronal %<input name="inss_patronal" inputmode="decimal" value="${vig?.inss_patronal ?? 22.5}"></label>
      <label class="campo">INATEC %<input name="inatec" inputmode="decimal" value="${vig?.inatec ?? 2}"></label>
      <label class="campo">Techo mensual INSS (vacío = sin techo)<input name="techo_inss" inputmode="decimal" value="${vig?.techo_inss ?? ''}"></label>
      <label class="campo">Vacaciones por mes (días)<input name="dias_vacaciones_mes" inputmode="decimal" value="${vig?.dias_vacaciones_mes ?? 2.5}"></label>
      <label class="campo ancho">Sueldos (gasto)${ctaSel('cuenta_salarios_id', vig?.cuenta_salarios_id, ['gasto', 'costo'])}</label>
      <label class="campo ancho">Aportes patronales (gasto)${ctaSel('cuenta_patronal_id', vig?.cuenta_patronal_id, ['gasto', 'costo'])}</label>
      <label class="campo ancho">INSS por pagar${ctaSel('cuenta_inss_pagar_id', vig?.cuenta_inss_pagar_id, ['pasivo'])}</label>
      <label class="campo ancho">IR por pagar${ctaSel('cuenta_ir_pagar_id', vig?.cuenta_ir_pagar_id, ['pasivo'])}</label>
      <label class="campo ancho">INATEC por pagar${ctaSel('cuenta_inatec_pagar_id', vig?.cuenta_inatec_pagar_id, ['pasivo'])}</label>
      <label class="campo ancho">Salarios por pagar${ctaSel('cuenta_neto_pagar_id', vig?.cuenta_neto_pagar_id, ['pasivo'])}</label>
      <label class="campo ancho">Prestaciones (gasto)${ctaSel('cuenta_prestaciones_id', vig?.cuenta_prestaciones_id, ['gasto', 'costo'])}</label>
      <label class="campo">Aporte de AFC al ahorro %<input name="ahorro_afc_pct" inputmode="decimal" value="${vig?.ahorro_afc_pct ?? 5}"></label>
      <label class="campo">Retiro del ahorro cada (años)<input name="ahorro_anios_retiro" type="number" min="1" value="${vig?.ahorro_anios_retiro ?? 5}"></label>
      <label class="campo ancho">Plan de ahorro por pagar${ctaSel('cuenta_ahorro_pagar_id', vig?.cuenta_ahorro_pagar_id, ['pasivo'])}</label>
      <label class="campo ancho">Aporte al plan de ahorro (gasto)${ctaSel('cuenta_aporte_ahorro_id', vig?.cuenta_aporte_ahorro_id, ['gasto', 'costo'])}</label></div>`,
    async d => {
      const f = Object.fromEntries(new FormData($('form', d)));
      const v = { ...f }; ['inss_laboral', 'inss_patronal', 'inatec', 'dias_vacaciones_mes', 'ahorro_afc_pct'].forEach(k => v[k] = num(f[k])); v.ahorro_anios_retiro = Number(f.ahorro_anios_retiro) || 5;
      v.techo_inss = f.techo_inss ? num(f.techo_inss) : null;
      ['cuenta_salarios_id', 'cuenta_patronal_id', 'cuenta_inss_pagar_id', 'cuenta_ir_pagar_id', 'cuenta_inatec_pagar_id', 'cuenta_neto_pagar_id', 'cuenta_prestaciones_id', 'cuenta_ahorro_pagar_id', 'cuenta_aporte_ahorro_id'].forEach(k => v[k] = Number(f[k]));
      const existe = pars.find(p => p.vigente_desde === v.vigente_desde);
      if (existe) await q(sb.from('planilla_parametros').update(v).eq('id', existe.id)); else await q(sb.from('planilla_parametros').insert(v));
      avisar('Tasas guardadas'); vConfigPlanilla(m);
    });
  $('#b-ir').onclick = () => {
    const filas = tr.length ? tr : [{}];
    const fila = t => `<tr><td><input class="monto" data-k="desde" value="${t.desde ?? ''}"></td><td><input class="monto" data-k="hasta" value="${t.hasta ?? ''}" placeholder="sin límite"></td><td><input class="monto" data-k="base" value="${t.base ?? 0}"></td><td><input class="monto" data-k="porcentaje" value="${t.porcentaje ?? ''}"></td></tr>`;
    const d = abrirModal(`<h2>Tabla anual del IR</h2><label class="campo">Vigente desde<input type="date" name="vig" value="${vigIR || hoy()}"></label>
      <table class="lineas" style="margin-top:10px"><thead><tr><th>Desde (exclusivo)</th><th>Hasta</th><th>Impuesto base</th><th>%</th></tr></thead><tbody id="ir-f">${filas.map(fila).join('')}</tbody></table>
      <button type="button" class="btn sec chico" id="ir-mas" style="margin-top:8px">+ Tramo</button>
      <p class="muted" style="font-size:12.5px">Si cambia la fecha, se crea una tabla nueva y la anterior se conserva para planillas pasadas.</p>`,
      async dl => {
        const vg = $('[name=vig]', dl).value;
        const nuevos = $$('#ir-f tr', dl).map(r => Object.fromEntries($$('input', r).map(i => [i.dataset.k, i.value === '' ? null : num(i.value)]))).filter(t => t.desde !== null && t.porcentaje !== null)
          .map(t => ({ ...t, base: t.base || 0, vigente_desde: vg }));
        if (!nuevos.length) { avisar('Agregue al menos un tramo', 'error'); return false; }
        for (const t of tramos.filter(t => t.vigente_desde === vg)) await q(sb.from('ir_tramos').delete().eq('id', t.id));
        await q(sb.from('ir_tramos').insert(nuevos));
        avisar('Tabla del IR guardada'); vConfigPlanilla(m);
      });
    $('#ir-mas', d).onclick = () => $('#ir-f', d).insertAdjacentHTML('beforeend', fila({}));
  };
  const modalConcepto = c => abrirModal(`<h2>${c ? 'Concepto' : 'Nuevo concepto'}</h2><div class="rejilla">
      <label class="campo">Código<input name="codigo" value="${esc(c?.codigo || '')}" required></label>
      <label class="campo">Nombre<input name="nombre" value="${esc(c?.nombre || '')}" required></label>
      <label class="campo">Tipo<select name="tipo"><option value="ingreso" ${c?.tipo === 'ingreso' ? 'selected' : ''}>Ingreso</option><option value="deduccion" ${c?.tipo === 'deduccion' ? 'selected' : ''}>Deducción</option></select></label>
      <label class="campo chk"><input type="checkbox" name="afecta_inss" ${!c || c.afecta_inss ? 'checked' : ''}> Ingreso cotiza INSS</label>
      <label class="campo chk"><input type="checkbox" name="afecta_ir" ${!c || c.afecta_ir ? 'checked' : ''}> Ingreso paga IR</label>
      <label class="campo ancho">Cuenta contable (deducción: obligatoria; ingreso: vacío = sueldos)<select name="cuenta_id"><option value="">—</option>${cache.cuentas.filter(x => x.acepta_movimientos && x.activa).map(x => `<option value="${x.id}" ${x.id === c?.cuenta_id ? 'selected' : ''}>${esc(etiquetaCuenta(x))}</option>`).join('')}</select></label>
      <label class="campo chk"><input type="checkbox" name="activo" ${!c || c.activo ? 'checked' : ''}> Activo</label></div>`,
    async d => {
      const f = new FormData($('form', d));
      const v = { codigo: String(f.get('codigo')).trim().toUpperCase(), nombre: String(f.get('nombre')).trim(), tipo: f.get('tipo'), afecta_inss: f.get('afecta_inss') === 'on', afecta_ir: f.get('afecta_ir') === 'on', cuenta_id: Number(f.get('cuenta_id')) || null, activo: f.get('activo') === 'on' };
      if (v.tipo === 'deduccion' && !v.cuenta_id) { avisar('Una deducción necesita su cuenta contable', 'error'); return false; }
      if (c) await q(sb.from('conceptos_planilla').update(v).eq('id', c.id)); else await q(sb.from('conceptos_planilla').insert(v));
      avisar('Concepto guardado'); vConfigPlanilla(m);
    });
  $('#b-conc').onclick = () => modalConcepto();
  $$('[data-c]').forEach(r => r.onclick = () => modalConcepto(conceptos.find(c => c.id === Number(r.dataset.c))));
  $('#b-clave').onclick = async () => {
    try {
      const k = await q(sb.rpc('crear_clave_integracion', { p_nombre: 'App de marcaje' }));
      abrirModal(`<h2>Clave de la app de marcaje</h2><p>Cópiela ahora y péguela en la propiedad <code>AFC_CLAVE</code> del Apps Script. <b>No se vuelve a mostrar.</b></p>
        <input id="k-val" readonly value="${esc(k)}" style="width:100%;font-family:monospace;font-size:13px"><p class="muted" style="font-size:12.5px">Si se pierde o se filtra, desactívela y cree otra.</p>`,
        async () => { vConfigPlanilla(m); }, { textoGuardar: 'Ya la copié', extraIzq: '<button type="button" class="btn sec" id="k-copiar">Copiar</button>' });
      $('#k-copiar').onclick = () => { $('#k-val').select(); try { navigator.clipboard.writeText(k); avisar('Clave copiada'); } catch { document.execCommand('copy'); } };
    } catch (e) { fallo(e); }
  };
  $$('[data-desac]').forEach(b => b.onclick = async () => { if (!confirm('¿Desactivar esta clave? El marcaje dejará de enviar datos hasta que configure otra.')) return; try { await q(sb.rpc('desactivar_clave_integracion', { p_id: Number(b.dataset.desac) })); avisar('Clave desactivada'); vConfigPlanilla(m); } catch (e) { fallo(e); } });
}

iniciar();
</script>
