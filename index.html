let filtroProd = { texto: '', categoria: '' };
async function vProductos(m) {
  await cargarCatalogos();
  const cat = puede('inventario.catalogo');
  const f = filtroProd, t = f.texto.toLowerCase();
  const filas = cache.productos.filter(p => (!t || (p.codigo + ' ' + p.nombre).toLowerCase().includes(t)) && (!f.categoria || p.categoria_id === Number(f.categoria)));
  m.innerHTML = `
    <div class="cabecera"><div><h1>Productos</h1><p>${cache.productos.length} productos. La existencia se lleva en la unidad base; las presentaciones convierten al registrar.</p></div>
      <div class="acciones">${cat ? '<button class="btn" id="b-nuevo">+ Nuevo producto</button><button class="btn sec" id="b-unid">Unidades</button><button class="btn sec" id="b-cat">Categorías</button>' : ''}<button class="btn sec" id="b-csv">Exportar CSV</button></div></div>
    <div class="tarjeta">
      <form class="filtros" id="f-p">
        <label class="campo" style="flex:1">Buscar<input name="texto" value="${esc(f.texto)}" placeholder="Código o nombre"></label>
        <label class="campo">Categoría<select name="categoria"><option value="">Todas</option>${cache.categorias.map(c => `<option value="${c.id}" ${Number(f.categoria) === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label>
        <button class="btn sec">Filtrar</button></form>
      <div class="envoltura"><table>
        <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Unidad base</th><th>Presentaciones</th><th class="num">Mínimo</th><th class="num">Costo prom. C$</th><th></th></tr></thead>
        <tbody id="t-p">${filas.map(p => `<tr class="${cat ? 'clic' : ''}" data-id="${p.id}"><td>${esc(p.codigo)}</td><td>${esc(p.nombre)}</td>
          <td>${esc(cache.categorias.find(c => c.id === p.categoria_id)?.nombre || '')}</td><td>${esc(codUnidad(p.unidad_id))}</td>
          <td class="muted">${unidadesDe(p).slice(1).map(u => `${esc(codUnidad(u.unidad_id))} = ${fmtQ(u.factor)} ${esc(codUnidad(p.unidad_id))}`).join(' · ')}</td>
          <td class="num">${Number(p.stock_minimo) ? fmtQ(p.stock_minimo) : ''}</td><td class="num">${fmt(p.costo_promedio)}</td>
          <td>${p.activo ? '' : '<span class="etiqueta e-anulado">Inactivo</span>'}</td></tr>`).join('') || '<tr><td colspan="8" class="vacio">Sin productos</td></tr>'}</tbody>
      </table></div></div>`;
  $('#f-p').onsubmit = e => { e.preventDefault(); filtroProd = Object.fromEntries(new FormData(e.target)); vProductos(m); };
  $('#b-csv').onclick = () => csv('productos.csv', [['Codigo', 'Nombre', 'Categoria', 'Unidad', 'Minimo', 'Costo promedio', 'Activo'],
    ...cache.productos.map(p => [p.codigo, p.nombre, cache.categorias.find(c => c.id === p.categoria_id)?.nombre || '', codUnidad(p.unidad_id), p.stock_minimo, p.costo_promedio, p.activo ? 'Si' : 'No'])]);
  if (!cat) return;
  $('#b-nuevo').onclick = () => modalProducto(m);
  $('#t-p').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) modalProducto(m, productoPorId(tr.dataset.id)); };
  $('#b-unid').onclick = () => modalLista(m, 'unidades', 'Unidades de medida', [['codigo', 'Código'], ['nombre', 'Nombre']]);
  $('#b-cat').onclick = () => modalLista(m, 'categorias_producto', 'Categorías de productos', [['nombre', 'Nombre']]);
}

function modalProducto(m, p = null) {
  let pres = p ? cache.presentaciones.filter(x => x.producto_id === p.id).map(x => ({ unidad_id: x.unidad_id, factor: Number(x.factor) })) : [];
  const optsU = sel => cache.unidades.map(u => `<option value="${u.id}" ${u.id === Number(sel) ? 'selected' : ''}>${esc(u.codigo)} · ${esc(u.nombre)}</option>`).join('');
  const d = abrirModal(`<h2>${p ? 'Editar producto' : 'Nuevo producto'}</h2>
    <div class="rejilla">
      <label class="campo">Código<input name="codigo" value="${esc(p?.codigo || '')}" required></label>
      <label class="campo">Categoría<select name="categoria_id"><option value="">—</option>${cache.categorias.map(c => `<option value="${c.id}" ${c.id === p?.categoria_id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label>
      <label class="campo ancho">Nombre<input name="nombre" value="${esc(p?.nombre || '')}" required></label>
      <label class="campo">Unidad base<select name="unidad_id" required>${optsU(p?.unidad_id || cache.unidades.find(u => u.codigo === 'UND')?.id)}</select></label>
      <label class="campo">Existencia mínima<input name="stock_minimo" inputmode="decimal" value="${p ? fmtQ(p.stock_minimo) : '0'}"></label>
      <label class="campo ancho">Descripción<input name="descripcion" value="${esc(p?.descripcion || '')}"></label>
      <label class="campo chk"><input type="checkbox" name="activo" ${!p || p.activo ? 'checked' : ''}> Activo</label>
    </div>
    <h3 style="margin-top:14px">Presentaciones</h3>
    <p class="muted" style="font-size:13px;margin:4px 0 8px">Otras unidades en que se compra o despacha. Ej.: Caja = 24 unidades; Quintal = 100 libras.</p>
    <div id="pres"></div><button type="button" class="btn sec chico" id="b-pres">+ Agregar presentación</button>`,
    async d => {
      const f = new FormData($('form', d));
      const v = { codigo: String(f.get('codigo')).trim(), nombre: String(f.get('nombre')).trim(), categoria_id: Number(f.get('categoria_id')) || null,
        unidad_id: Number(f.get('unidad_id')), stock_minimo: num(f.get('stock_minimo')) || 0, descripcion: String(f.get('descripcion')).trim() || null, activo: f.get('activo') === 'on' };
      const ps = pres.filter(x => x.unidad_id && num(x.factor) > 0);
      if (ps.some(x => Number(x.unidad_id) === v.unidad_id)) { avisar('Una presentación no puede usar la unidad base', 'error'); return false; }
      if (new Set(ps.map(x => Number(x.unidad_id))).size !== ps.length) { avisar('Hay dos presentaciones con la misma unidad', 'error'); return false; }
      let id = p?.id;
      if (p) await q(sb.from('productos').update(v).eq('id', p.id));
      else id = (await q(sb.from('productos').insert(v).select('id').single())).id;
      await q(sb.from('producto_presentaciones').delete().eq('producto_id', id));
      if (ps.length) await q(sb.from('producto_presentaciones').insert(ps.map(x => ({ producto_id: id, unidad_id: Number(x.unidad_id), factor: num(x.factor) }))));
      avisar('Producto guardado'); vProductos(m);
    }, { extraIzq: p ? '<button type="button" class="btn peligro" id="b-borrar">Eliminar</button>' : '' });
  const pintarPres = () => {
    $('#pres', d).innerHTML = pres.map((x, i) => `<div class="filtros" style="margin-bottom:6px" data-i="${i}">
      <label class="campo">Unidad<select data-f="unidad_id"><option value="">—</option>${optsU(x.unidad_id)}</select></label>
      <label class="campo">Equivale a (unidades base)<input data-f="factor" inputmode="decimal" value="${x.factor || ''}"></label>
      <button type="button" class="btn sec chico" data-q>✕</button></div>`).join('');
  };
  $('#pres', d).addEventListener('input', e => { const i = Number(e.target.closest('[data-i]').dataset.i); pres[i][e.target.dataset.f] = e.target.value; });
  $('#pres', d).addEventListener('change', e => { const i = Number(e.target.closest('[data-i]').dataset.i); pres[i][e.target.dataset.f] = e.target.value; });
  $('#pres', d).addEventListener('click', e => { if (e.target.closest('[data-q]')) { pres.splice(Number(e.target.closest('[data-i]').dataset.i), 1); pintarPres(); } });
  $('#b-pres', d).onclick = () => { pres.push({ unidad_id: '', factor: '' }); pintarPres(); };
  pintarPres();
  if (p) $('#b-borrar', d).onclick = async () => {
    if (!confirm(`¿Eliminar el producto ${p.codigo}?`)) return;
    try { await q(sb.from('productos').delete().eq('id', p.id)); d.close(); avisar('Producto eliminado'); vProductos(m); } catch (e) { fallo(e); }
  };
}

// Editor simple de una tabla de catálogo (unidades, categorías)
function modalLista(m, tabla, titulo, campos) {
  const filas = tabla === 'unidades' ? cache.unidades : cache.categorias;
  const d = abrirModal(`<h2>${esc(titulo)}</h2>
    <div class="envoltura" style="max-height:340px;overflow:auto"><table><tbody>${filas.map(x => `<tr>${campos.map(([k]) => `<td>${esc(x[k])}</td>`).join('')}
      <td class="num"><button type="button" class="btn sec chico" data-borrar="${x.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>
    <h3 style="margin-top:14px">Agregar</h3><div class="filtros">${campos.map(([k, t]) => `<label class="campo">${t}<input name="${k}" required></label>`).join('')}</div>`,
    async d => {
      const v = Object.fromEntries(campos.map(([k]) => [k, $(`[name=${k}]`, d).value.trim()]));
      await q(sb.from(tabla).insert(v)); avisar('Agregado'); await cargarCatalogos(); vProductos(m);
    }, { textoGuardar: 'Agregar' });
  $$('[data-borrar]', d).forEach(b => b.onclick = async () => {
    try { await q(sb.from(tabla).delete().eq('id', Number(b.dataset.borrar))); d.close(); avisar('Eliminado'); vProductos(m); } catch (e) { fallo(e); }
  });
}

// ============================================================
// Bodegas y cuentas contables del inventario
// ============================================================
async function vBodegas(m) {
  await cargarCatalogos();
  const [ex, par] = await Promise.all([q(sb.from('existencias').select('*')), q(sb.from('inv_parametros').select('*').eq('id', 1).maybeSingle())]);
  const cat = puede('inventario.catalogo'), ctaEdit = cat || puede('contabilidad.editar');
  const resumen = b => { const xs = ex.filter(e => e.bodega_id === b.id && Number(e.cantidad)); return { n: xs.length, v: xs.reduce((s, e) => s + Number(e.cantidad) * Number(productoPorId(e.producto_id)?.costo_promedio || 0), 0), vis: cache.misBodegas.includes(b.id) }; };
  const activos = cache.cuentas.filter(c => c.acepta_movimientos && c.activa);
  const selCta = (name, sel, filtro = () => true) => `<select name="${name}" ${ctaEdit ? '' : 'disabled'}><option value="">— Sin configurar —</option>${activos.filter(filtro).map(c => `<option value="${c.id}" ${c.id === Number(sel) ? 'selected' : ''}>${esc(etiquetaCuenta(c))}</option>`).join('')}</select>`;
  m.innerHTML = `
    <div class="cabecera"><div><h1>Bodegas</h1><p>${cache.bodegas.length} bodegas. Cada una puede usar su propia cuenta contable de inventario.</p></div>
      ${cat ? '<button class="btn" id="b-nueva">+ Nueva bodega</button>' : ''}</div>
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Código</th><th>Nombre</th><th>Ubicación</th><th>Cuenta de inventario</th><th class="num">Productos</th><th class="num">Valor C$</th><th></th></tr></thead>
      <tbody id="t-b">${cache.bodegas.map(b => { const r = resumen(b); return `<tr class="${cat ? 'clic' : ''}" data-id="${b.id}"><td>${esc(b.codigo)}</td><td>${esc(b.nombre)}</td><td>${esc(b.ubicacion || '')}</td>
        <td class="muted">${esc(etiquetaCuenta(cuentaPorId(b.cuenta_inventario_id)))}</td><td class="num">${r.vis ? r.n : ''}</td><td class="num">${r.vis ? fmt(r.v) : '<span class="muted">sin acceso</span>'}</td>
        <td>${b.activa ? '' : '<span class="etiqueta e-anulado">Inactiva</span>'}</td></tr>`; }).join('') || '<tr><td colspan="7" class="vacio">Sin bodegas</td></tr>'}</tbody>
    </table></div></div>
    <div class="tarjeta"><h2>Cuentas contables del inventario</h2>
      <p class="muted">Se proponen al registrar cada movimiento; en cada uno se pueden cambiar.</p>
      <form id="f-par"><div class="rejilla">
        <label class="campo">Entradas: contrapartida${selCta('cuenta_entrada_id', par?.cuenta_entrada_id)}<span class="muted" style="font-weight:400">Ej.: Proveedores</span></label>
        <label class="campo">Salidas: cargo${selCta('cuenta_salida_id', par?.cuenta_salida_id)}<span class="muted" style="font-weight:400">Ej.: Costo de programas</span></label>
        <label class="campo">Ajustes y diferencias${selCta('cuenta_ajuste_id', par?.cuenta_ajuste_id)}<span class="muted" style="font-weight:400">Sobrantes, faltantes y diferencias de costo</span></label>
      </div>${ctaEdit ? '<div class="acciones" style="margin-top:12px"><button class="btn">Guardar cuentas</button></div>' : ''}</form></div>`;
  $('#f-par').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await q(sb.from('inv_parametros').update({ cuenta_entrada_id: Number(f.get('cuenta_entrada_id')) || null, cuenta_salida_id: Number(f.get('cuenta_salida_id')) || null, cuenta_ajuste_id: Number(f.get('cuenta_ajuste_id')) || null }).eq('id', 1));
      avisar('Cuentas guardadas'); } catch (err) { fallo(err); }
  };
  if (!cat) return;
  const modal = (b = null) => {
    const d = abrirModal(`<h2>${b ? 'Editar bodega' : 'Nueva bodega'}</h2><div class="rejilla">
      <label class="campo">Código<input name="codigo" value="${esc(b?.codigo || '')}" required placeholder="B04"></label>
      <label class="campo ancho">Nombre<input name="nombre" value="${esc(b?.nombre || '')}" required></label>
      <label class="campo ancho">Ubicación<input name="ubicacion" value="${esc(b?.ubicacion || '')}" placeholder="Comunidad, municipio"></label>
      <label class="campo ancho">Cuenta contable de inventario<select name="cuenta_inventario_id" required>${activos.filter(c => c.tipo === 'activo').map(c => `<option value="${c.id}" ${c.id === (b?.cuenta_inventario_id ?? cache.bodegas[0]?.cuenta_inventario_id) ? 'selected' : ''}>${esc(etiquetaCuenta(c))}</option>`).join('')}</select></label>
      <label class="campo chk"><input type="checkbox" name="activa" ${!b || b.activa ? 'checked' : ''}> Activa</label></div>`,
      async d => {
        const f = new FormData($('form', d));
        const v = { codigo: String(f.get('codigo')).trim(), nombre: String(f.get('nombre')).trim(), ubicacion: String(f.get('ubicacion')).trim() || null,
          cuenta_inventario_id: Number(f.get('cuenta_inventario_id')), activa: f.get('activa') === 'on' };
        if (b) await q(sb.from('bodegas').update(v).eq('id', b.id)); else await q(sb.from('bodegas').insert(v));
        avisar('Bodega guardada'); vBodegas(m);
      }, { extraIzq: b ? '<button type="button" class="btn peligro" id="b-borrar">Eliminar</button>' : '' });
    if (b) $('#b-borrar', d).onclick = async () => {
      if (!confirm(`¿Eliminar la bodega ${b.codigo}?`)) return;
      try { await q(sb.from('bodegas').delete().eq('id', b.id)); d.close(); avisar('Bodega eliminada'); vBodegas(m); } catch (e) { fallo(e); }
    };
  };
  $('#b-nueva').onclick = () => modal();
  $('#t-b').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) modal(bodegaPorId(tr.dataset.id)); };
}

iniciar();
</script>
