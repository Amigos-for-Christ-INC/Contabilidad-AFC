<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contabilidad AFC</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>try{const t=localStorage.getItem('afc_tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro');document.documentElement.dataset.tema=t}catch(e){}</script>
<style>
/* =============================================================
   Tema Amigos for Christ — claro y oscuro
   ============================================================= */
:root{
  --azul:#00758F; --navy:#0A2240; --celeste:#96D1DE;
  --error:#B3261E; --ok:#00758F;
  --fondo:#F5EDEC; --superficie:#FFFFFF; --superficie2:#FAF6F5; --borde:#E3E0E7; --borde-fuerte:#CFCCD6;
  --texto:#414042; --texto2:#6D6E71; --titulo:#0A2240; --acento:#00758F;
  --sombra:0 1px 2px rgba(10,34,64,.06), 0 4px 14px rgba(10,34,64,.05);
  --sombra-alta:0 10px 30px rgba(10,34,64,.14);
  --hover-fila:rgba(0,117,143,.06);
  --radio:12px; --radio-chico:8px;
  --lateral:#0A2240; --lateral-texto:#FFFFFF;
  --t:.22s cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
:root[data-tema="oscuro"]{
  --fondo:#06162B; --superficie:#0D2442; --superficie2:#112C50; --borde:rgba(150,209,222,.14); --borde-fuerte:rgba(150,209,222,.28);
  --texto:#DCE6EE; --texto2:#9DB2C6; --titulo:#FFFFFF; --acento:#96D1DE;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --sombra-alta:0 14px 40px rgba(0,0,0,.5);
  --hover-fila:rgba(150,209,222,.07);
  --lateral:#041021;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Raleway,Avenir,"Proxima Nova",sans-serif;color:var(--texto);background:var(--fondo);
  font-size:15px;font-weight:400;font-feature-settings:"lnum" 1,"tnum" 1;font-variant-numeric:lining-nums tabular-nums;
  transition:background-color .3s, color .3s}
button,input,select,textarea{font:inherit;color:inherit;font-feature-settings:"lnum" 1,"tnum" 1}
a{color:var(--acento)}
h1,h2,h3{margin:0;color:var(--titulo);font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em} h2{font-size:18px} h3{font-size:15px}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.lateral{background:var(--lateral);color:var(--lateral-texto);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.lateral img{width:150px;margin:4px 8px 6px}
.lateral .sub{color:var(--celeste);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 8px}
.buscador{display:flex;align-items:center;gap:8px;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#cfe3ea;
  border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;transition:background var(--t), border-color var(--t)}
.buscador:hover{background:rgba(255,255,255,.12);border-color:rgba(150,209,222,.5)}
.buscador kbd{margin-left:auto;font-family:inherit;font-size:11px;background:rgba(255,255,255,.12);padding:2px 6px;border-radius:5px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav .grupo{color:var(--celeste);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 10px 4px;opacity:.85}
.nav a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:9px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:10px;
  position:relative;transition:background var(--t), transform var(--t)}
.nav a .ico{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}
.nav a.activo{background:var(--azul);font-weight:600;box-shadow:0 4px 14px rgba(0,117,143,.35)}
.nav a.activo .ico{opacity:1}
.nav a .insignia{margin-left:auto;background:var(--celeste);color:var(--navy);font-size:11px;font-weight:800;border-radius:20px;padding:1px 7px}
.usuario{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:12px 8px 0;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--celeste));color:var(--navy);display:grid;place-items:center;font-weight:800;grid-row:span 2}
.usuario b{font-weight:600}
.usuario span{color:var(--celeste);font-size:12px}
.usuario .botones{grid-column:1/-1;display:flex;gap:6px;margin-top:8px}
.usuario button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;transition:background var(--t)}
.usuario button:hover{background:rgba(255,255,255,.1)}
main{padding:28px 34px 70px;min-width:0;max-width:1400px}
.barra-movil{display:none}

/* ---------- Animaciones ---------- */
@keyframes entrar{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@keyframes deslizar{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes brillo{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(0,117,143,.45)}50%{box-shadow:0 0 0 6px rgba(0,117,143,0)}}
.vista > *{animation:entrar .38s cubic-bezier(.2,.7,.2,1) both}
.vista > *:nth-child(2){animation-delay:.04s} .vista > *:nth-child(3){animation-delay:.08s}
.vista > *:nth-child(4){animation-delay:.12s} .vista > *:nth-child(5){animation-delay:.16s} .vista > *:nth-child(n+6){animation-delay:.2s}
.esqueleto{display:grid;gap:14px}
.esq{border-radius:var(--radio);background:linear-gradient(90deg,var(--superficie) 0px,var(--superficie2) 120px,var(--superficie) 240px);
  background-size:800px 100%;animation:brillo 1.2s infinite linear}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }

/* ---------- Componentes ---------- */
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cabecera p{margin:4px 0 0;color:var(--texto2)}
.tarjeta{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:20px 22px;margin-bottom:16px;box-shadow:var(--sombra)}
.tarjeta > h2:first-child{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--radio);padding:16px 18px;box-shadow:var(--sombra);position:relative;overflow:hidden;
  transition:transform var(--t), box-shadow var(--t)}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--azul);opacity:.07}
.kpi .et{font-size:13px;color:var(--texto2);font-weight:500}
.kpi .val{font-size:27px;font-weight:900;color:var(--acento);margin-top:6px;white-space:nowrap}
.kpi .val.navy{color:var(--titulo)}
.kpi .det{font-size:12px;color:var(--texto2);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--azul);background:var(--azul);color:#fff;border-radius:9px;
  padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:transform .12s, box-shadow var(--t), filter var(--t), background var(--t)}
.btn:hover{filter:brightness(1.08);box-shadow:0 4px 14px rgba(0,117,143,.28);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.sec{background:var(--superficie);color:var(--acento);border-color:var(--borde-fuerte)}
.btn.sec:hover{border-color:var(--azul);box-shadow:none}
.btn.navy{background:var(--navy);border-color:var(--navy)}
:root[data-tema="oscuro"] .btn.navy{background:#1B3A63;border-color:#1B3A63}
.btn.peligro{background:transparent;color:var(--error);border-color:var(--error)}
:root[data-tema="oscuro"] .btn.peligro{color:#F2B8B5;border-color:#F2B8B5}
.btn.chico{padding:4px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--texto2)}
input,select,textarea{border:1px solid var(--borde-fuerte);border-radius:8px;padding:8px 10px;background:var(--superficie);font-size:14px;min-width:0;
  transition:border-color var(--t), box-shadow var(--t)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,117,143,.18)}
input.invalido{border-color:var(--error);background:rgba(179,38,30,.06)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.rejilla .ancho{grid-column:1/-1}
.envoltura{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;color:var(--titulo);border-bottom:2px solid var(--borde);padding:9px 8px;white-space:nowrap;font-size:12.5px;letter-spacing:.02em}
td{border-bottom:1px solid var(--borde);padding:8px;vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
tr.clic{cursor:pointer} tr.clic td{transition:background .15s} tr.clic:hover td{background:var(--hover-fila)}
tr.grupo td{font-weight:600;color:var(--titulo)}
tr.total td{font-weight:700;color:var(--titulo);border-top:2px solid var(--titulo);border-bottom:none}
.ind{display:inline-block}
.etiqueta{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.e-borrador{background:var(--azul);color:#fff}
.e-contabilizado,.e-aprobado{background:var(--navy);color:#fff}
:root[data-tema="oscuro"] .e-contabilizado,:root[data-tema="oscuro"] .e-aprobado{background:var(--celeste);color:var(--navy)}
.e-aprobada{background:var(--navy);color:#fff}
:root[data-tema="oscuro"] .e-aprobada{background:var(--celeste);color:var(--navy)}
.e-anulada,.e-rechazado{background:var(--borde);color:var(--texto2)}
.e-pendiente{background:transparent;color:var(--acento);border:1.5px solid var(--acento)}
.e-por_aprobar{background:transparent;color:var(--acento);border:1.5px solid var(--acento);animation:latido 2s infinite}
.e-anulado{background:var(--borde);color:var(--texto2)}
.e-abierto{background:var(--azul);color:#fff}
.e-cerrado{background:var(--navy);color:#fff}
.muted{color:var(--texto2)}
.vacio{padding:40px 10px;text-align:center;color:var(--texto2)}
.vacio .ilus{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
.cargando{padding:36px 10px;color:var(--texto2)}
.lineas td{padding:4px}
.lineas input,.lineas select{width:100%}
.lineas .c-cuenta{min-width:260px} .lineas .c-monto{width:130px} .lineas .c-centro{width:150px}
.lineas input.monto{text-align:right}
.totales{display:flex;gap:24px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;font-size:14px}
.totales b{color:var(--titulo)}
.dif-mal{color:var(--error);font-weight:700}
:root[data-tema="oscuro"] .dif-mal{color:#F2B8B5}
.dif-bien{color:var(--acento);font-weight:700}
.aviso{border-left:4px solid var(--azul);background:var(--superficie);border-radius:8px;padding:11px 14px;margin-bottom:14px;box-shadow:var(--sombra)}
.aviso.error{border-color:var(--error)}
.pestanas{display:flex;gap:4px;border-bottom:2px solid var(--borde);margin-bottom:16px;overflow-x:auto}
.pestanas a{padding:9px 14px;text-decoration:none;color:var(--texto2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color var(--t), border-color var(--t);white-space:nowrap}
.pestanas a:hover{color:var(--acento)}
.pestanas a.activo{color:var(--acento);border-color:var(--acento)}
.pestanas a .n{font-size:11px;background:var(--borde);border-radius:20px;padding:1px 7px;margin-left:4px}
.reporte-titulo{text-align:center;margin-bottom:12px}
.reporte-titulo img{height:44px;margin-bottom:6px}
:root[data-tema="oscuro"] .reporte-titulo img,:root[data-tema="oscuro"] .acceso .caja > img,:root[data-tema="oscuro"] .acceso-logo{filter:brightness(0) invert(1)}
.reporte-titulo .muted{font-size:13px}
.meta{font-size:13px;color:var(--texto2);display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
details summary{cursor:pointer;color:var(--acento);font-size:13px}
pre{white-space:pre-wrap;font-size:12px;background:var(--fondo);padding:8px;border-radius:6px;max-width:640px}

/* ---------- Panel de inicio ---------- */
.saludo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.saludo h1{font-size:30px}
.rapidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.rapida{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radio);background:var(--superficie);border:1px solid var(--borde);
  text-decoration:none;color:var(--titulo);font-weight:600;box-shadow:var(--sombra);transition:transform var(--t), box-shadow var(--t), border-color var(--t)}
.rapida:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta);border-color:var(--azul)}
.rapida .circ{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(0,117,143,.12);color:var(--acento);flex:none;transition:transform var(--t)}
.rapida:hover .circ{transform:rotate(-8deg) scale(1.08)}
.rapida small{display:block;font-weight:500;color:var(--texto2);font-size:12px}
.graficos{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.graficos > *{min-width:0}
.graf{position:relative;height:260px;width:100%;overflow:hidden}
.pendiente{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--borde);cursor:pointer;transition:background .15s;border-radius:6px}
.pendiente:hover{background:var(--hover-fila)}
.pendiente:last-child{border-bottom:none}
.pendiente .monto{margin-left:auto;font-weight:700;color:var(--titulo);white-space:nowrap}

/* ---------- Cheque ---------- */
.cheque{position:relative;aspect-ratio:175/76;max-width:720px;border-radius:10px;overflow:hidden;color:#0A2240;
  background:
    repeating-linear-gradient(115deg, rgba(0,117,143,.05) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(65deg, rgba(10,34,64,.04) 0 1px, transparent 1px 7px),
    linear-gradient(135deg,#EAF6F9,#F7FBFC 55%,#E3F1F5);
  border:1px solid #BFDDE5;box-shadow:var(--sombra-alta);font-size:clamp(10px,1.6vw,14px);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.cheque:hover{transform:rotate(-.4deg) scale(1.01)}
.cheque .banco{position:absolute;left:4%;top:7%;font-weight:900;letter-spacing:.06em;color:#0A2240;font-size:1.25em}
.cheque .banco small{display:block;font-weight:500;letter-spacing:0;font-size:.62em;color:#41606f}
.cheque .num{position:absolute;right:4%;top:7%;font-weight:800;color:#00758F}
.cheque .campo-c{position:absolute;border-bottom:1px solid rgba(10,34,64,.35);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 1px}
.cheque .campo-c .et{position:absolute;left:0;top:-1.25em;font-size:.6em;font-weight:600;color:#41606f;text-transform:uppercase;letter-spacing:.06em}
.cheque .marca{position:absolute;right:4%;bottom:9%;width:32%;border-top:1px solid rgba(10,34,64,.45);text-align:center;font-size:.6em;color:#41606f;padding-top:2px}
.cheque .mic{position:absolute;left:4%;bottom:6%;font-family:monospace;letter-spacing:.2em;font-size:.75em;color:#41606f}
.cheque .sello{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);font-size:2.4em;font-weight:900;letter-spacing:.1em;
  border:4px solid currentColor;border-radius:10px;padding:2px 18px;opacity:.22;color:#B3261E}

/* ---------- Paleta de comandos ---------- */
#paleta{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(4,16,33,.5);backdrop-filter:blur(3px)}
#paleta.abierta{display:flex;animation:aparecer .15s}
#paleta .caja{width:min(640px,94vw);background:var(--superficie);border:1px solid var(--borde);border-radius:16px;box-shadow:var(--sombra-alta);overflow:hidden;animation:pop .2s cubic-bezier(.2,.7,.2,1)}
#paleta input{width:100%;border:none;border-bottom:1px solid var(--borde);border-radius:0;padding:18px 20px;font-size:17px;background:transparent;box-shadow:none}
#paleta .res{max-height:52vh;overflow:auto;padding:6px}
#paleta .gr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texto2);padding:10px 12px 4px}
#paleta .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--texto)}
#paleta .it small{margin-left:auto;color:var(--texto2);font-size:12px;white-space:nowrap}
#paleta .it.sel{background:var(--azul);color:#fff} #paleta .it.sel small{color:#dff2f6}
#paleta .ayuda{border-top:1px solid var(--borde);padding:8px 14px;font-size:12px;color:var(--texto2);display:flex;gap:14px}

/* ---------- Acceso ---------- */
.acceso{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 20% 20%,rgba(0,117,143,.55),transparent 45%),radial-gradient(circle at 80% 85%,rgba(150,209,222,.25),transparent 40%),#0A2240}
.acceso .caja{background:var(--superficie);border-radius:18px;padding:32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,.7,.2,1)}
.acceso img{width:190px;display:block;margin:0 auto 10px}
.acceso h1{text-align:center;color:var(--acento);margin-bottom:4px}
.acceso p.muted{text-align:center;margin:0 0 20px}
.acceso form{display:flex;flex-direction:column;gap:12px}
.acceso .btn{justify-content:center}
.separador{text-align:center;color:var(--texto2);font-size:13px;margin:6px 0}

/* ---------- Avisos y modal ---------- */
#aviso-flotante{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;max-width:420px;box-shadow:var(--sombra-alta);font-size:14px;
  animation:deslizar .3s cubic-bezier(.2,.7,.2,1);display:flex;gap:10px;align-items:center;border-left:4px solid var(--celeste)}
.toast.error{background:var(--superficie);color:var(--error);border:1px solid var(--error);border-left-width:4px}
:root[data-tema="oscuro"] .toast.error{color:#F2B8B5;border-color:#F2B8B5}
.toast.salir{opacity:0;transform:translateX(30px);transition:all .3s}
dialog{border:1px solid var(--borde);border-radius:16px;padding:0;width:min(580px,94vw);box-shadow:var(--sombra-alta);background:var(--superficie);color:var(--texto)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.7,.2,1)}
dialog::backdrop{background:rgba(4,16,33,.5);backdrop-filter:blur(2px)}
dialog .cuerpo{padding:24px;max-height:72vh;overflow:auto}
dialog .pie{display:flex;justify-content:space-between;gap:8px;padding:14px 24px;background:var(--superficie2);border-top:1px solid var(--borde)}
.chk{flex-direction:row !important;align-items:center;gap:8px !important;font-size:14px !important;color:var(--texto) !important;font-weight:500 !important}

/* ---------- Impresión ---------- */
#impresion{display:none}

@media (max-width:1000px){ .graficos{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}

// Lee todas las filas en páginas de 1,000 (Supabase entrega como máximo 1,000 por consulta)
const MAX_FILAS = 20000;
async function todas(b, max = MAX_FILAS) {
  // la consulta se lanza en el mismo instante en que se fija el rango (el constructor de Supabase se reutiliza)
  const pagina = i => new Promise((ok, mal) => b.range(i, Math.min(i + 999, max - 1)).then(r => r.error ? mal(r.error) : ok(r.data), mal));
  const out = await pagina(0);
  // si hay más, pide las siguientes páginas de 4 en 4 al mismo tiempo
  for (let i = 1000; out.length === i && i < max; i += 4000) {
    const lotes = await Promise.all([0, 1, 2, 3].map(k => i + k * 1000).filter(x => x < max).map(pagina));
    for (const l of lotes) { out.push(...l); if (l.length < 1000) return out; }
  }
  if (out.length >= max) out.truncado = true;
  return out;
}

    <button type="button" class="btn sec" data-mas="${id}">Mostrar las ${(filas.length - lim).toLocaleString('en-US')} filas restantes</button></td></tr>`;

document.addEventListener('click', e => { const b = e.target.closest('[data-mas]'); if (!b) return; const tr = b.closest('tr'); tr.insertAdjacentHTML('afterend', MAS[b.dataset.mas]()); delete MAS[b.dataset.mas]; tr.remove(); });

async function iniciar() {
  const c = configActual();
  if (!c.url || !c.key) return pantallaConfig();
  try {
    sb = supabase.createClient(c.url, c.key);
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { yo = null; pantallaAcceso(); } });
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return pantallaAcceso();
    await entrar(session.user);
  } catch (e) { fallo(e); pantallaAcceso(); }

let filtroAsientos = null;
async function vAsientos(m) {
  if (!filtroAsientos) { const [d, h] = rangoMes(); filtroAsientos = { desde: d, hasta: h, estado: '', texto: '' }; }
  const f = filtroAsientos;
  m.innerHTML = `
    <div class="cabecera"><div><h1>Asientos contables</h1><p>Libro diario</p></div>
      <div class="acciones">${editor() ? '<a class="btn" href="#asiento/nuevo">+ Nuevo asiento</a>' : ''}<button class="btn sec" id="b-csv">Exportar CSV</button></div></div>
    <div class="tarjeta">
      <form class="filtros" id="f-filtro">

        <label class="campo">Hasta<input type="date" name="hasta" value="${f.hasta}"></label>
        <label class="campo">Estado<select name="estado">
          <option value="">Todos</option>${['borrador','contabilizado','anulado'].map(e => `<option value="${e}" ${f.estado === e ? 'selected' : ''}>${e[0].toUpperCase() + e.slice(1)}</option>`).join('')}</select></label>

      <div class="envoltura" id="lista"><div class="cargando">Cargando…</div></div>
    </div>`;
  $('#f-filtro').onsubmit = e => { e.preventDefault(); Object.assign(filtroAsientos, Object.fromEntries(new FormData(e.target))); vAsientos(m); };
  let consulta = sb.from('asientos').select('id,numero,fecha,tipo,concepto,referencia,moneda,estado,origen,asiento_lineas(debe,debe_me)')

    <tbody>${filasLargas(filas, a => `<tr class="clic" onclick="location.hash='asiento/${a.id}'">
      <td>${a.numero ?? '<span class="muted">—</span>'}</td><td>${fecha(a.fecha)}</td><td>${TIPOS_ASIENTO[a.tipo]}</td>
      <td>${esc(a.concepto)}${a.moneda === 'USD' ? ' <span class="muted">(US$)</span>' : ''}${a.origen !== 'manual' ? ` <span class="muted">(${a.origen})</span>` : ''}</td><td>${esc(a.referencia)}</td>
      <td class="num">${fmt(total(a))}</td><td><span class="etiqueta e-${a.estado}">${a.estado}</span></td></tr>`, 7)}</tbody></table>`
    : '<div class="vacio">No hay asientos con estos filtros.</div>');
  $('#b-csv').onclick = () => csv(`asientos_${f.desde}_${f.hasta}.csv`,
    [['Numero','Fecha','Tipo','Concepto','Referencia','Moneda','Total C$','Estado'],
     ...filas.map(a => [a.numero ?? '', a.fecha, TIPOS_ASIENTO[a.tipo], a.concepto, a.referencia ?? '', a.moneda, total(a).toFixed(2), a.estado])]);

let plantillaAsiento = null;
async function vAsiento(m, arg) {
  let A;
  if (!puede('contabilidad.ver')) { m.innerHTML = '<div class="aviso error">No tiene acceso a la contabilidad.</div>'; return; }
  if (arg === 'nuevo' || !arg) {
    A = plantillaAsiento || { fecha: hoy(), tipo: 'diario', moneda: 'NIO', concepto: '', referencia: '', tipo_cambio: '', estado: 'nuevo',
      lineas: [] };
    plantillaAsiento = null;
    if (!A.lineas.length) A.lineas = [{}, {}];
    if (!editor()) { m.innerHTML = '<div class="aviso error">Su usuario es de consulta; no puede registrar asientos.</div>'; return; }
  } else {
    const a = await q(sb.from('asientos').select('*, asiento_lineas(*)').eq('id', Number(arg)).single());
    a.asiento_lineas.sort((x, y) => x.orden - y.orden || x.id - y.id);
    const usd = a.moneda === 'USD';
    A = { ...a, tipo_cambio: a.tipo_cambio ?? '',
      lineas: a.asiento_lineas.map(l => ({ cuenta_id: l.cuenta_id, centro_costo_id: l.centro_costo_id ?? '', descripcion: l.descripcion ?? '',
        debe: usd ? l.debe_me : l.debe, haber: usd ? l.haber_me : l.haber, debe_c: l.debe, haber_c: l.haber })) };
  }
  const editable = editor() && (A.estado === 'nuevo' || A.estado === 'borrador');
  return editable ? formAsiento(m, A) : verAsiento(m, A);
}

          <tr class="total"><td colspan="3">Totales</td>${usd ? `<td class="num">${fmt(tdm)}</td><td class="num">${fmt(thm)}</td>` : ''}<td class="num">${fmt(td)}</td><td class="num">${fmt(th)}</td></tr>

        ${A.contabilizado_en ? `<span>Contabilizado: ${esc(nombrePerfil(A.contabilizado_por))} · ${fechaHora(A.contabilizado_en)}</span>` : ''}

  if (A.origen === 'inventario' && puede('inventario.ver')) {

      if (c && $('#origen-ch')) $('#origen-ch').innerHTML = `Asiento generado automáticamente por ${b[0] ? 'la anulación del' : 'el'} <a href="#cheque/${c.id}">cheque Nº ${c.numero}</a>.`;

     <label class="campo">Motivo<textarea name="motivo" rows="3" required></textarea></label>`,

function formAsiento(m, A) {
  const nuevo = A.estado === 'nuevo';
  m.innerHTML = `
    <div class="cabecera"><div><h1>${nuevo ? 'Nuevo asiento' : 'Asiento en borrador'}</h1><p><a href="#asientos">← Volver a asientos</a></p></div>
      <div class="acciones">
        ${nuevo ? '' : '<button class="btn peligro" id="b-eliminar">Eliminar borrador</button>'}
        <button class="btn sec" id="b-guardar">Guardar borrador</button>
        <button class="btn" id="b-contab">Contabilizar</button>
      </div></div>
    <div class="tarjeta">
      <div class="rejilla">
        <label class="campo">Fecha<input type="date" id="a-fecha" value="${A.fecha}"></label>
        <label class="campo">Tipo<select id="a-tipo">${Object.entries(TIPOS_ASIENTO).filter(([k]) => k !== 'cierre' || A.tipo === 'cierre').map(([k, v]) => `<option value="${k}" ${A.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="campo">Moneda<select id="a-moneda"><option value="NIO" ${A.moneda === 'NIO' ? 'selected' : ''}>Córdobas (C$)</option><option value="USD" ${A.moneda === 'USD' ? 'selected' : ''}>Dólares (US$)</option></select></label>
        <label class="campo" id="c-tc">Tipo de cambio<input id="a-tc" inputmode="decimal" value="${A.tipo_cambio ?? ''}" placeholder="C$ por US$"><span class="muted" id="tc-nota" style="font-weight:400"></span></label>
        <label class="campo">Referencia<input id="a-ref" value="${esc(A.referencia)}" placeholder="Factura, cheque, recibo…"></label>
        <label class="campo ancho">Concepto<input id="a-concepto" value="${esc(A.concepto)}" placeholder="Descripción general del asiento"></label>
      </div>
    </div>
    <div class="tarjeta">
      <div class="envoltura"><table class="lineas">
        <thead><tr><th class="c-cuenta">Cuenta</th><th class="c-centro">Centro de costo</th><th>Descripción</th><th class="num c-monto" id="h-debe">Debe</th><th class="num c-monto" id="h-haber">Haber</th><th></th></tr></thead>
        <tbody id="cuerpo-lineas"></tbody>
      </table></div>
      ${datalistCuentas('dl-cuentas', true)}
      <div class="acciones" style="margin-top:10px"><button class="btn sec chico" id="b-linea">+ Agregar línea</button></div>
      <div class="totales" id="totales"></div>
    </div>`;

  const usd = () => $('#a-moneda').value === 'USD';
  const pintarLineas = () => {
    $('#cuerpo-lineas').innerHTML = A.lineas.map((l, i) => `<tr data-i="${i}">
      <td><input list="dl-cuentas" data-f="cuenta" value="${esc(etiquetaCuenta(cuentaPorId(l.cuenta_id)))}" placeholder="Código o nombre"></td>
      <td><select data-f="centro_costo_id">${opcionesCentro(l.centro_costo_id)}</select></td>
      <td><input data-f="descripcion" value="${esc(l.descripcion)}"></td>
      <td><input class="monto" data-f="debe" inputmode="decimal" value="${l.debe ? fmt(l.debe) : ''}"></td>
      <td><input class="monto" data-f="haber" inputmode="decimal" value="${l.haber ? fmt(l.haber) : ''}"></td>
      <td><button class="btn sec chico" data-quitar title="Quitar línea">✕</button></td></tr>`).join('');
    totales();
  };
  const totales = () => {
    const d = r2(A.lineas.reduce((s, l) => s + (num(l.debe) || 0), 0)), h = r2(A.lineas.reduce((s, l) => s + (num(l.haber) || 0), 0));
    const dif = r2(d - h), mon = usd() ? 'US$' : 'C$', tc = num($('#a-tc').value);
    $('#h-debe').textContent = `Debe ${mon}`; $('#h-haber').textContent = `Haber ${mon}`;
    $('#totales').innerHTML = `<span>Debe: <b>${mon} ${fmt(d)}</b></span><span>Haber: <b>${mon} ${fmt(h)}</b></span>
      <span class="${dif === 0 && d > 0 ? 'dif-bien' : 'dif-mal'}">${dif === 0 && d > 0 ? 'Cuadra ✓' : 'Diferencia: ' + mon + ' ' + fmt(Math.abs(dif))}</span>
      ${usd() && tc > 0 ? `<span class="muted">≈ C$ ${fmt(d * tc)}</span>` : ''}`;
    return { d, h, dif };
  };
  const tcAuto = async () => {
    $('#c-tc').style.display = usd() ? '' : 'none';
    if (!usd()) return totales();
    const r = await q(sb.from('tipos_cambio').select('tasa').eq('fecha', $('#a-fecha').value).maybeSingle()).catch(() => null);
    $('#tc-nota').textContent = r ? `Oficial del día: ${Number(r.tasa).toFixed(4)}` : 'No hay tipo de cambio registrado para esta fecha';
    if (r && !$('#a-tc').dataset.manual) $('#a-tc').value = Number(r.tasa).toFixed(4);
    totales();
  };
  $('#a-moneda').onchange = tcAuto; $('#a-fecha').onchange = tcAuto;
  $('#a-tc').oninput = e => { e.target.dataset.manual = '1'; totales(); };
  if (A.tipo_cambio) $('#a-tc').dataset.manual = '1';

  const cuerpo = $('#cuerpo-lineas');
  cuerpo.addEventListener('input', e => {
    const tr = e.target.closest('tr'), i = Number(tr.dataset.i), f = e.target.dataset.f, l = A.lineas[i];
    if (f === 'debe' || f === 'haber') {
      l[f] = e.target.value;
      const otro = f === 'debe' ? 'haber' : 'debe';
      if (e.target.value && l[otro]) { l[otro] = ''; $(`[data-f=${otro}]`, tr).value = ''; }
      e.target.classList.toggle('invalido', isNaN(num(e.target.value)) || num(e.target.value) < 0);
      totales();
    } else if (f === 'descripcion') l.descripcion = e.target.value;
  });
  cuerpo.addEventListener('change', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const i = Number(tr.dataset.i), f = e.target.dataset.f, l = A.lineas[i];
    if (f === 'cuenta') {
      const c = cuentaDesdeTexto(e.target.value);
      l.cuenta_id = c?.id ?? null;
      if (c) e.target.value = etiquetaCuenta(c);
      e.target.classList.toggle('invalido', !!e.target.value.trim() && !c);
      if (!c && e.target.value.trim()) avisar('Elija una cuenta de la lista que acepte movimientos', 'error');
    } else if (f === 'centro_costo_id') l.centro_costo_id = e.target.value;
    else if (f === 'debe' || f === 'haber') { const n = num(e.target.value); if (n && !isNaN(n)) e.target.value = fmt(n); }
  });
  cuerpo.addEventListener('click', e => {
    if (!e.target.closest('[data-quitar]')) return;
    const i = Number(e.target.closest('tr').dataset.i);
    A.lineas.splice(i, 1); if (!A.lineas.length) A.lineas.push({});
    pintarLineas();
  });
  $('#b-linea').onclick = () => {
    const ult = A.lineas.at(-1) || {};
    A.lineas.push({ centro_costo_id: ult.centro_costo_id || '', descripcion: '' });
    pintarLineas();
    $(`tr[data-i="${A.lineas.length - 1}"] [data-f=cuenta]`).focus();
  };

  const datos = () => ({
    id: nuevo ? null : A.id, fecha: $('#a-fecha').value, tipo: $('#a-tipo').value, moneda: $('#a-moneda').value,
    tipo_cambio: usd() ? num($('#a-tc').value) || null : null,
    referencia: $('#a-ref').value, concepto: $('#a-concepto').value,
    lineas: A.lineas.map(l => ({ cuenta_id: l.cuenta_id || null, centro_costo_id: l.centro_costo_id || null, descripcion: l.descripcion || '',
      debe: num(l.debe) || 0, haber: num(l.haber) || 0 }))
  });
  const validar = (contab) => {
    if (!$('#a-concepto').value.trim()) return 'Escriba el concepto del asiento';
    if ($$('#cuerpo-lineas .invalido').length) return 'Hay campos marcados en rojo por corregir';
    const conMonto = A.lineas.filter(l => num(l.debe) || num(l.haber));
    if (conMonto.some(l => !l.cuenta_id)) return 'Hay líneas con monto pero sin cuenta';
    if (contab) {
      const t = totales();
      if (conMonto.length < 2) return 'El asiento necesita al menos dos líneas';
      if (t.dif !== 0) return 'El asiento no cuadra: revise Debe y Haber';
      if (usd() && !(num($('#a-tc').value) > 0)) return 'Falta el tipo de cambio';
    }
    return null;
  };
  const guardar = async (contab, boton) => {
    const err = validar(contab); if (err) return avisar(err, 'error');
    if (contab && !confirm('Al contabilizar, el asiento ya no se podrá editar (solo anular). ¿Continuar?')) return;
    boton.disabled = true;
    try {
      const id = await q(sb.rpc('guardar_asiento', { p: datos(), p_contabilizar: contab }));
      avisar(contab ? 'Asiento contabilizado' : 'Borrador guardado');
      if (location.hash === `#asiento/${id}`) mostrar(); else location.hash = `asiento/${id}`;
    } catch (e) { fallo(e); } finally { boton.disabled = false; }
  };
  $('#b-guardar').onclick = e => guardar(false, e.currentTarget);
  $('#b-contab').onclick = e => guardar(true, e.currentTarget);
  if ($('#b-eliminar')) $('#b-eliminar').onclick = async () => {
    if (!confirm('¿Eliminar este borrador?')) return;
    try { await q(sb.rpc('eliminar_borrador', { p_id: A.id })); avisar('Borrador eliminado'); location.hash = 'asientos'; } catch (e) { fallo(e); }
  };
  pintarLineas(); tcAuto();
}

  };
}

  m.innerHTML = `
    <div class="cabecera"><div><h1>Tipos de cambio</h1><p>Córdobas por cada dólar, según el tipo de cambio oficial del Banco Central de Nicaragua.</p></div>

      <label class="campo">Fecha<input type="date" name="fecha" value="${hoy()}" required></label>
      <label class="campo">C$ por US$ 1<input name="tasa" inputmode="decimal" required placeholder="36.6243"></label>
      <button class="btn">Guardar</button></form></div>` : ''}
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Fecha</th><th class="num">C$ por US$</th><th></th></tr></thead>
      <tbody>${filas.map(t => `<tr><td>${fecha(t.fecha)}</td><td class="num">${Number(t.tasa).toFixed(4)}</td>
        <td class="num">${editor() ? `<button class="btn sec chico" data-borrar="${t.fecha}">Eliminar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="vacio">Sin registros</td></tr>'}</tbody>
    </table></div></div>`;
  if (!editor()) return;
  $('#f-tc').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await q(sb.from('tipos_cambio').upsert({ fecha: f.get('fecha'), tasa: num(f.get('tasa')) })); avisar('Tipo de cambio guardado'); vTiposCambio(m); } catch (err) { fallo(err); }
  };
  $$('[data-borrar]').forEach(b => b.onclick = async () => {
    if (!confirm('¿Eliminar este tipo de cambio?')) return;
    try { await q(sb.from('tipos_cambio').delete().eq('fecha', b.dataset.borrar)); vTiposCambio(m); } catch (e) { fallo(e); }
  });
  $('#b-importar').onclick = () => abrirModal(`<h2>Pegar tipos de cambio</h2>
    <p class="muted" style="font-size:13px">Una línea por día: fecha y tasa, separadas por espacio, tabulación o punto y coma. Sirve copiar dos columnas de Excel.<br>Ej.: <code>01/11/2026 36.6243</code></p>
    <textarea name="texto" rows="10" style="width:100%" required></textarea>`,
    async d => {
      const filas = [], malas = [];
      $('[name=texto]', d).value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(s => {
        const r = s.match(/^(\S+)[\s;,]+([0-9]+[.,][0-9]+)$/);
        let f = r?.[1];
        if (f && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(f)) { const [dd, mm, yy] = f.split('/'); f = `${yy}-${mm.padStart(2, '0')}-${dd.padStart(2, '0')}`; }
        if (r && /^\d{4}-\d{2}-\d{2}$/.test(f)) filas.push({ fecha: f, tasa: Number(r[2].replace(',', '.')) }); else malas.push(s);
      });
      if (malas.length) { avisar(`No se entendieron ${malas.length} línea(s), por ejemplo: ${malas[0]}`, 'error'); return false; }
      await q(sb.from('tipos_cambio').upsert(filas));
      avisar(`${filas.length} tipos de cambio guardados`); vTiposCambio(m);
    }, { textoGuardar: 'Importar' });
}

async function vEstados(m, arg) {
  const pest = arg === 'balance' ? 'balance' : 'resultados';
  if (!paramEstados) { const [d, h] = rangoMes(); paramEstados = { desde: d.slice(0, 4) + '-01-01', hasta: h, al: h, centro: '', nivel: '3' }; }
  const p = paramEstados;
  m.innerHTML = `
    <div class="cabecera"><div><h1>Estados financieros</h1><p>Cifras en córdobas</p></div>
      <div class="acciones no-imprimir"><button class="btn sec" id="b-csv">Exportar CSV</button><button class="btn sec" onclick="print()">Imprimir</button></div></div>
    <div class="pestanas"><a href="#estados/resultados" class="${pest === 'resultados' ? 'activo' : ''}">Estado de resultados</a><a href="#estados/balance" class="${pest === 'balance' ? 'activo' : ''}">Balance general</a></div>
    <div class="tarjeta">
      <form class="filtros" id="f-est">
        ${pest === 'resultados'
          ? `<label class="campo">Desde<input type="date" name="desde" value="${p.desde}"></label><label class="campo">Hasta<input type="date" name="hasta" value="${p.hasta}"></label>
             <label class="campo">Centro<select name="centro">${opcionesCentro(p.centro, true)}</select></label>`
          : `<label class="campo">Al<input type="date" name="al" value="${p.al}"></label>`}
        <label class="campo">Detalle<select name="nivel">${[2, 3, 4].map(n => `<option value="${n}" ${p.nivel == n ? 'selected' : ''}>Hasta nivel ${n}</option>`).join('')}<option value="9" ${p.nivel == 9 ? 'selected' : ''}>Todo</option></select></label>
        <button class="btn">Consultar</button>
      </form>
      <div id="res"><div class="cargando">Cargando…</div></div>
    </div>`;
  $('#f-est').onsubmit = e => { e.preventDefault(); Object.assign(paramEstados, Object.fromEntries(new FormData(e.target))); vEstados(m, pest); };

  const filasCsv = [];
  const fila = (x, valor, clase = '') => { filasCsv.push([x.codigo, x.nombre, r2(valor)]);
    return `<tr class="${clase || (x.acepta_movimientos ? '' : 'grupo')}"><td><span class="ind" style="padding-left:${Math.max(0, x.nivel - 2) * 16}px">${esc(x.nombre)}</span></td><td class="num">${fmt(valor)}</td></tr>`; };
  const total = (txt, v) => { filasCsv.push(['', txt, r2(v)]); return `<tr class="total"><td>${esc(txt)}</td><td class="num">${fmt(v)}</td></tr>`; };
  const encabezado = (txt) => `<tr><td colspan="2" style="padding-top:18px;border:none"><h3>${esc(txt)}</h3></td></tr>`;
  // El primer nivel ya es el título y el total de cada sección; se listan sus subcuentas.
  const seccion = (bal, tipo, val) => bal.filter(x => x.tipo === tipo && x.nivel <= Number(p.nivel) && (x.nivel > 1 || x.acepta_movimientos) && val(x) !== 0).map(x => fila(x, val(x))).join('');
  const raiz = (bal, tipo, val) => bal.filter(x => x.tipo === tipo && x.nivel === 1).reduce((s, x) => s + val(x), 0);
  let html;

  if (pest === 'resultados') {
    const bal = await q(sb.rpc('balanza', { p_desde: p.desde, p_hasta: p.hasta, p_centro: p.centro ? Number(p.centro) : null }));
    const mov = x => r2(Number(x.saldo_final) - Number(x.saldo_inicial));
    const ing = raiz(bal, 'ingreso', mov), cos = raiz(bal, 'costo', mov), gas = raiz(bal, 'gasto', mov);
    html = `<div class="reporte-titulo"><img src="logo.png" alt="Amigos for Christ"><h2>Estado de resultados</h2>
      <div class="muted">Del ${fecha(p.desde)} al ${fecha(p.hasta)}${p.centro ? ' · ' + esc(cache.centros.find(c => c.id === Number(p.centro))?.nombre) : ''} · Cifras en C$</div></div>
      <div class="envoltura"><table><tbody>
      ${encabezado('Ingresos')}${seccion(bal, 'ingreso', mov)}${total('Total ingresos', ing)}
      ${cos ? encabezado('Costos') + seccion(bal, 'costo', mov) + total('Total costos', cos) + total('Resultado bruto', ing - cos) : ''}
      ${encabezado('Gastos')}${seccion(bal, 'gasto', mov)}${total('Total gastos', gas)}
      <tr><td colspan="2" style="border:none;height:8px"></td></tr>
      ${total(ing - cos - gas >= 0 ? 'Excedente (utilidad) del período' : 'Déficit (pérdida) del período', ing - cos - gas)}
      </tbody></table></div>`;
  } else {
    const bal = await q(sb.rpc('balanza', { p_desde: '1900-01-01', p_hasta: p.al }));
    const sal = x => r2(Number(x.saldo_final));
    const act = raiz(bal, 'activo', sal), pas = raiz(bal, 'pasivo', sal), pat = raiz(bal, 'patrimonio', sal);
    const res = raiz(bal, 'ingreso', sal) - raiz(bal, 'costo', sal) - raiz(bal, 'gasto', sal);
    const dif = r2(act - (pas + pat + res));
    html = `<div class="reporte-titulo"><img src="logo.png" alt="Amigos for Christ"><h2>Balance general</h2><div class="muted">Al ${fecha(p.al)} · Cifras en C$</div></div>
      ${dif ? `<div class="aviso error">El balance no cuadra por C$ ${fmt(dif)}. Revise la balanza de comprobación.</div>` : ''}
      <div class="envoltura"><table><tbody>
      ${encabezado('Activo')}${seccion(bal, 'activo', sal)}${total('Total activo', act)}
      ${encabezado('Pasivo')}${seccion(bal, 'pasivo', sal)}${total('Total pasivo', pas)}
      ${encabezado('Patrimonio')}${seccion(bal, 'patrimonio', sal)}
      ${res ? fila({ codigo: '', nombre: 'Resultado del ejercicio (sin cerrar)', nivel: 2, acepta_movimientos: true }, res) : ''}
      ${total('Total patrimonio', pat + res)}
      <tr><td colspan="2" style="border:none;height:8px"></td></tr>
      ${total('Total pasivo y patrimonio', pas + pat + res)}
      </tbody></table></div>`;
  }
  $('#res').innerHTML = html;
  $('#b-csv').onclick = () => csv(`${pest === 'balance' ? 'balance_general_' + p.al : 'estado_resultados_' + p.desde + '_' + p.hasta}.csv`, [['Codigo','Concepto','Monto C$'], ...filasCsv]);
}

async function vPeriodos(m) {
  const per = await q(sb.from('periodos').select('*').order('anio', { ascending: false }).order('mes', { ascending: false }));
  const patrimonio = cache.cuentas.filter(c => c.tipo === 'patrimonio' && c.acepta_movimientos && c.activa);
  const anio = Number(hoy().slice(0, 4));
  m.innerHTML = `
    <div class="cabecera"><div><h1>Períodos y cierre</h1><p>Un mes cerrado no acepta asientos nuevos, cambios ni anulaciones.</p></div></div>
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Período</th><th>Estado</th><th>Cerrado por</th><th></th></tr></thead>
      <tbody>${per.map(x => `<tr><td>${MESES[x.mes - 1]} ${x.anio}</td><td><span class="etiqueta e-${x.estado}">${x.estado}</span></td>
        <td class="muted">${x.cerrado_en ? esc(nombrePerfil(x.cerrado_por)) + ' · ' + fechaHora(x.cerrado_en) : ''}</td>
        <td class="num">${puede('contabilidad.periodos') ? `<button class="btn ${x.estado === 'abierto' ? 'navy' : 'sec'} chico" data-anio="${x.anio}" data-mes="${x.mes}" data-acc="${x.estado === 'abierto' ? 'cerrar' : 'abrir'}">${x.estado === 'abierto' ? 'Cerrar' : 'Reabrir'}</button>` : ''}</td></tr>`).join('')
        || '<tr><td colspan="4" class="vacio">Los períodos se crean solos al registrar el primer asiento de cada mes.</td></tr>'}</tbody>
    </table></div></div>
    ${editor() ? `<div class="tarjeta"><h2>Cierre del ejercicio</h2>
      <p class="muted">Genera en borrador, al 31 de diciembre, el asiento que lleva a cero ingresos, costos y gastos del año y pasa el resultado a la cuenta de patrimonio elegida. Revíselo y contabilícelo como cualquier asiento.</p>
      <form class="filtros" id="f-cierre" style="margin:0">
        <label class="campo">Año<input type="number" name="anio" value="${anio}" min="2000" max="2100" required></label>
        <label class="campo" style="min-width:260px">Cuenta de patrimonio destino<select name="cuenta" required>${patrimonio.map(c => `<option value="${c.id}" ${/acumulad/i.test(c.nombre) ? 'selected' : ''}>${esc(etiquetaCuenta(c))}</option>`).join('')}</select></label>
        <button class="btn">Generar asiento de cierre</button>
      </form></div>` : ''}`;
  $$('[data-acc]').forEach(b => b.onclick = async () => {
    const a = Number(b.dataset.anio), mm = Number(b.dataset.mes), cerrar = b.dataset.acc === 'cerrar';
    if (!confirm(`¿${cerrar ? 'Cerrar' : 'Reabrir'} ${MESES[mm - 1]} ${a}?`)) return;
    try { await q(sb.rpc(cerrar ? 'cerrar_periodo' : 'abrir_periodo', { p_anio: a, p_mes: mm })); avisar(cerrar ? 'Período cerrado' : 'Período reabierto'); vPeriodos(m); } catch (e) { fallo(e); }
  });
  if ($('#f-cierre')) $('#f-cierre').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const id = await q(sb.rpc('generar_asiento_cierre', { p_anio: Number(f.get('anio')), p_cuenta_destino: Number(f.get('cuenta')) }));
      avisar('Asiento de cierre generado en borrador'); location.hash = 'asiento/' + id; } catch (err) { fallo(err); }
  };
}

async function vUsuarios(m) {
  if (!admin()) { m.innerHTML = '<div class="aviso error">Solo un administrador ve esta sección.</div>'; return; }
  await cargarCatalogos();
  const pb = await q(sb.from('perfil_bodegas').select('*'));
  const bodegasDe = id => pb.filter(x => x.perfil_id === id).map(x => x.bodega_id);
  const rolTodas = id => { const r = cache.roles.find(x => x.id === id); return r && (r.permisos.includes('*') || r.permisos.includes('inventario.todas_bodegas')); };
  const sinRol = cache.perfiles.filter(u => !u.rol_id).length;
  m.innerHTML = `
    <div class="cabecera"><div><h1>Usuarios</h1><p>Quien se registra entra sin acceso hasta que usted le asigne un rol.</p></div>
      <a class="btn sec" href="#roles">Roles y permisos</a></div>
    ${sinRol ? `<div class="aviso">${sinRol} usuario(s) esperan que les asigne un rol.</div>` : ''}
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Bodegas</th><th>Desde</th></tr></thead>
      <tbody>${cache.perfiles.map(u => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.correo)}</td>
        <td><select data-id="${u.id}"><option value="">Sin rol (sin acceso)</option>${cache.roles.map(r => `<option value="${r.id}" ${u.rol_id === r.id ? 'selected' : ''}>${esc(r.nombre)}</option>`).join('')}</select></td>
        <td>${rolTodas(u.rol_id) ? '<span class="muted">Todas</span>' : `<button class="btn sec chico" data-bod="${u.id}">${bodegasDe(u.id).length ? bodegasDe(u.id).map(b => esc(bodegaPorId(b)?.codigo || '')).join(', ') : 'Asignar'}</button>`}</td>
        <td class="muted">${fecha(u.creado_en)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="muted" style="font-size:13px">Los roles sin el permiso "todas las bodegas" (por ejemplo, Bodeguero) solo trabajan en las bodegas que se les asignen aquí.</p></div>`;
  $$('select[data-id]').forEach(s => s.onchange = async () => {
    try { await q(sb.rpc('cambiar_rol', { p_usuario: s.dataset.id, p_rol: s.value ? Number(s.value) : null })); avisar('Rol actualizado'); vUsuarios(m); } catch (e) { fallo(e); vUsuarios(m); }
  });
  $$('[data-bod]').forEach(b => b.onclick = () => {
    const u = cache.perfiles.find(x => x.id === b.dataset.bod), act = bodegasDe(u.id);
    abrirModal(`<h2>Bodegas de ${esc(u.nombre)}</h2><p class="muted">Marque las bodegas donde puede ver y registrar movimientos.</p>
      ${cache.bodegas.map(x => `<label class="campo chk"><input type="checkbox" value="${x.id}" ${act.includes(x.id) ? 'checked' : ''}> ${esc(x.codigo)} · ${esc(x.nombre)}${x.activa ? '' : ' (inactiva)'}</label>`).join('')}`,
      async d => { await q(sb.rpc('asignar_bodegas', { p_usuario: u.id, p_bodegas: $$('input[type=checkbox]:checked', d).map(c => Number(c.value)) })); avisar('Bodegas asignadas'); vUsuarios(m); });
  });
}

async function vRoles(m) {
  if (!admin()) { m.innerHTML = '<div class="aviso error">Solo un administrador ve esta sección.</div>'; return; }
  await cargarCatalogos();
  const usuarios = id => cache.perfiles.filter(u => u.rol_id === id).length;
  const etiquetas = r => r.permisos.includes('*') ? '<span class="etiqueta e-contabilizado">Todo</span>' :
    PERMISOS.filter(p => r.permisos.includes(p[0])).map(p => `<span class="etiqueta e-anulado" title="${esc(p[2])}">${esc(p[3])}</span>`).join(' ') || '<span class="muted">Ninguno</span>';
  m.innerHTML = `
    <div class="cabecera"><div><h1>Roles y permisos</h1><p>Cada usuario tiene un rol; el rol define qué puede ver y hacer.</p></div>
      <button class="btn" id="b-nuevo">+ Nuevo rol</button></div>
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Rol</th><th>Descripción</th><th>Permisos</th><th class="num">Usuarios</th></tr></thead>
      <tbody>${cache.roles.map(r => `<tr class="clic" data-id="${r.id}"><td><b>${esc(r.nombre)}</b>${r.sistema ? ' <span class="muted">(sistema)</span>' : ''}</td>
        <td class="muted">${esc(r.descripcion)}</td><td style="line-height:2">${etiquetas(r)}</td><td class="num">${usuarios(r.id)}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
  const modal = (r = null) => {
    const sis = r?.sistema;
    const grupos = [...new Set(PERMISOS.map(p => p[1]))];
    const d = abrirModal(`<h2>${r ? (sis ? 'Rol del sistema' : 'Editar rol') : 'Nuevo rol'}</h2>
      ${sis ? '<div class="aviso">El rol Administrador tiene todos los permisos y no se puede modificar.</div>' : ''}
      <div class="rejilla"><label class="campo">Nombre<input name="nombre" value="${esc(r?.nombre || '')}" required ${sis ? 'disabled' : ''}></label>
      <label class="campo ancho">Descripción<input name="descripcion" value="${esc(r?.descripcion || '')}" ${sis ? 'disabled' : ''}></label></div>
      ${grupos.map(g => `<h3 style="margin-top:14px">${g}</h3>${PERMISOS.filter(p => p[1] === g).map(p => `<label class="campo chk"><input type="checkbox" value="${p[0]}" ${r && (r.permisos.includes('*') || r.permisos.includes(p[0])) ? 'checked' : ''} ${sis ? 'disabled' : ''}> ${esc(p[2])}</label>`).join('')}`).join('')}`,
      async d => {
        if (sis) return;
        const v = { nombre: $('[name=nombre]', d).value.trim(), descripcion: $('[name=descripcion]', d).value.trim() || null,
          permisos: $$('input[type=checkbox]:checked', d).map(c => c.value) };
        if (r) await q(sb.from('roles').update(v).eq('id', r.id)); else await q(sb.from('roles').insert(v));
        avisar('Rol guardado'); vRoles(m);
      }, { extraIzq: r && !sis ? '<button type="button" class="btn peligro" id="b-borrar">Eliminar</button>' : '' });
    if (r && !sis) $('#b-borrar', d).onclick = async () => {
      if (!confirm(`¿Eliminar el rol ${r.nombre}?`)) return;
      try { await q(sb.from('roles').delete().eq('id', r.id)); d.close(); avisar('Rol eliminado'); vRoles(m); } catch (e) { fallo(e); }
    };
  };
  $('#b-nuevo').onclick = () => modal();
  $('tbody').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) modal(cache.roles.find(r => r.id === Number(tr.dataset.id))); };
}

async function vBitacora(m) {
  if (!admin()) { m.innerHTML = '<div class="aviso error">Solo el administrador ve esta sección.</div>'; return; }
  const filas = await q(sb.from('bitacora').select('*').order('fecha', { ascending: false }).limit(300));
  const OPS = { INSERT: 'Creó', UPDATE: 'Modificó', DELETE: 'Eliminó' };
  const TABLAS = { empleados: 'Colaborador', planillas: 'Planilla', planilla_parametros: 'Tasas de planilla', ir_tramos: 'Tabla del IR', conceptos_planilla: 'Concepto de planilla', vacaciones_movimientos: 'Vacaciones', cuentas_bancarias: 'Cuenta bancaria', cheques: 'Cheque', cuentas: 'Cuenta', centros_costo: 'Centro de costo', tipos_cambio: 'Tipo de cambio', periodos: 'Período', asientos: 'Asiento', perfiles: 'Usuario', roles: 'Rol', bodegas: 'Bodega', productos: 'Producto', inv_parametros: 'Cuentas de inventario', inv_movimientos: 'Movimiento de inventario' };
  const cambios = (a, d) => {
    if (!a || !d) return JSON.stringify(a || d, null, 1);
    return Object.keys(d).filter(k => JSON.stringify(a[k]) !== JSON.stringify(d[k])).map(k => `${k}: ${JSON.stringify(a[k])} → ${JSON.stringify(d[k])}`).join('\n');
  };
  m.innerHTML = `
    <div class="cabecera"><div><h1>Bitácora</h1><p>Últimos 300 cambios: quién cambió qué y cuándo.</p></div></div>
    <div class="tarjeta"><div class="envoltura"><table>
      <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Registro</th><th>Detalle</th></tr></thead>
      <tbody>${filas.map(b => `<tr><td style="white-space:nowrap">${fechaHora(b.fecha)}</td><td>${esc(nombrePerfil(b.usuario) || 'Sistema')}</td>
        <td>${OPS[b.operacion] || b.operacion} ${TABLAS[b.tabla] || b.tabla}</td><td>${esc(b.registro)}</td>
        <td><details><summary>Ver</summary><pre>${esc(cambios(b.datos_antes, b.datos_despues))}</pre></details></td></tr>`).join('') || '<tr><td colspan="5" class="vacio">Sin registros</td></tr>'}</tbody>
    </table></div></div>`;
}

const bodegasAccesibles = (soloActivas = true) => cache.bodegas.filter(b => cache.misBodegas.includes(b.id) && (!soloActivas || b.activa));
const opcionesBodega = (lista, sel, todas = '') => (todas ? `<option value="">${todas}</option>` : '') +
  lista.map(b => `<option value="${b.id}" ${b.id === Number(sel) ? 'selected' : ''}>${esc(b.codigo)} · ${esc(b.nombre)}</option>`).join('');
const unidadesDe = p => p ? [{ unidad_id: p.unidad_id, factor: 1 }, ...cache.presentaciones.filter(x => x.producto_id === p.id).map(x => ({ unidad_id: x.unidad_id, factor: Number(x.factor) }))] : [];
const codUnidad = id => unidadPorId(id)?.codigo || '';
function productoDesdeTexto(txt) {
  const cod = String(txt || '').split(' — ')[0].trim();
  return cache.productos.find(p => p.codigo === cod && p.activo) || null;
}
const datalistProductos = (id, soloActivos = true) => `<datalist id="${id}">` + cache.productos.filter(p => !soloActivos || p.activo).map(p => `<option value="${esc(etiquetaProducto(p))}"></option>`).join('') + '</datalist>';

async function resumenInventario() {
  const [ex, borr] = await Promise.all([
    todas(sb.from('existencias').select('*')),
    puede('inventario.editar') ? q(sb.from('inv_movimientos').select('id,tipo,fecha,concepto,bodega_id').eq('estado', 'borrador').order('fecha', { ascending: false }).limit(6)) : Promise.resolve([])
  ]);
  const tot = {}; ex.forEach(e => tot[e.producto_id] = (tot[e.producto_id] || 0) + Number(e.cantidad));
  const valor = cache.productos.reduce((s, p) => s + (tot[p.id] || 0) * Number(p.costo_promedio), 0);
  const bajos = cache.productos.filter(p => p.activo && Number(p.stock_minimo) > 0 && (tot[p.id] || 0) < Number(p.stock_minimo));
  return `<h2 style="margin:22px 0 12px">Inventario${puede('inventario.todas_bodegas') ? '' : ' de mis bodegas'}</h2>
    <div class="kpis">
      <div class="kpi"><div class="et">Valor del inventario (C$)</div><div class="val">${fmt(valor)}</div></div>
      <div class="kpi"><div class="et">Productos con existencia</div><div class="val navy">${Object.values(tot).filter(v => v > 0).length}</div></div>
      <div class="kpi"><div class="et">Bajo el mínimo</div><div class="val ${bajos.length ? '' : 'navy'}">${bajos.length}</div></div>
      <div class="kpi"><div class="et">Bodegas</div><div class="val navy">${bodegasAccesibles().length}</div></div>
    </div>
    ${bajos.length ? `<div class="tarjeta"><h2>Productos bajo el mínimo</h2><div class="envoltura"><table><thead><tr><th>Producto</th><th class="num">Existencia</th><th class="num">Mínimo</th></tr></thead><tbody>
      ${bajos.slice(0, 8).map(p => `<tr class="clic" onclick="location.hash='kardex/${p.id}'"><td>${esc(etiquetaProducto(p))}</td><td class="num">${fmtQ(tot[p.id] || 0)} ${esc(codUnidad(p.unidad_id))}</td><td class="num">${fmtQ(p.stock_minimo)}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}
    ${borr.length ? `<div class="tarjeta"><h2>Movimientos de inventario en borrador</h2><div class="envoltura"><table><tbody>
      ${borr.map(b => `<tr class="clic" onclick="location.hash='movimiento/${b.id}'"><td style="width:110px">${fecha(b.fecha)}</td><td style="width:90px">${TIPOS_MOV[b.tipo]}</td><td>${esc(b.concepto)}</td><td class="muted">${esc(bodegaPorId(b.bodega_id)?.nombre)}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}`;
}

let filtroExist = { texto: '', categoria: '', bajos: false, ceros: true };
async function vExistencias(m) {
  await cargarCatalogos();
  const ex = await todas(sb.from('existencias').select('*'));
  const bods = bodegasAccesibles(false).filter(b => b.activa || ex.some(e => e.bodega_id === b.id && Number(e.cantidad)));
  const cant = {}; ex.forEach(e => cant[e.producto_id + ':' + e.bodega_id] = Number(e.cantidad));
  const f = filtroExist;
  const t = f.texto.toLowerCase();
  const filas = cache.productos.map(p => {
    const porB = bods.map(b => cant[p.id + ':' + b.id] || 0), total = porB.reduce((s, x) => s + x, 0);
    return { p, porB, total, valor: r2(total * Number(p.costo_promedio)), bajo: Number(p.stock_minimo) > 0 && total < Number(p.stock_minimo) };
  }).filter(r => (r.p.activo || r.total) && (!t || (r.p.codigo + ' ' + r.p.nombre).toLowerCase().includes(t))
    && (!f.categoria || r.p.categoria_id === Number(f.categoria)) && (!f.bajos || r.bajo) && (!f.ceros || r.total || r.bajo));
  const totB = bods.map((_, i) => filas.reduce((s, r) => s + r.porB[i] * Number(r.p.costo_promedio), 0));
  const totV = filas.reduce((s, r) => s + r.valor, 0);
  m.innerHTML = `
    <div class="cabecera"><div><h1>Existencias</h1><p>${puede('inventario.todas_bodegas') ? 'Todas las bodegas' : 'Sus bodegas asignadas'} · cantidades en la unidad base de cada producto</p></div>
      <div class="acciones no-imprimir">${puede('inventario.editar') ? `<a class="btn" href="#movimiento/nuevo-entrada">+ Entrada</a><a class="btn sec" href="#movimiento/nuevo-salida">+ Salida</a><a class="btn sec" href="#movimiento/nuevo-traslado">+ Traslado</a>` : ''}
        <button class="btn sec" id="b-csv">Exportar CSV</button><button class="btn sec" onclick="print()">Imprimir</button></div></div>
    <div class="kpis">${bods.map((b, i) => `<div class="kpi"><div class="et">${esc(b.nombre)} (C$)</div><div class="val navy">${fmt(totB[i])}</div></div>`).join('')}
      <div class="kpi"><div class="et">Total (C$)</div><div class="val">${fmt(totV)}</div></div></div>
    <div class="tarjeta">
      <form class="filtros" id="f-ex">
        <label class="campo" style="flex:1;min-width:180px">Buscar<input name="texto" value="${esc(f.texto)}" placeholder="Código o nombre"></label>
        <label class="campo">Categoría<select name="categoria"><option value="">Todas</option>${cache.categorias.map(c => `<option value="${c.id}" ${Number(f.categoria) === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></label>
        <label class="campo chk"><input type="checkbox" name="bajos" ${f.bajos ? 'checked' : ''}> Solo bajo el mínimo</label>
        <label class="campo chk"><input type="checkbox" name="ceros" ${f.ceros ? 'checked' : ''}> Ocultar sin existencia</label>
        <button class="btn sec">Filtrar</button>
      </form>
      <div class="reporte-titulo" style="display:none" id="tit-imp"><img src="logo.png" alt="Amigos for Christ"><h2>Existencias al ${fecha(hoy())}</h2></div>
      <div class="envoltura"><table>
        <thead><tr><th>Código</th><th>Producto</th><th>Unidad</th>${bods.map(b => `<th class="num" title="${esc(b.nombre)}">${esc(b.codigo)}</th>`).join('')}<th class="num">Total</th><th class="num">Costo prom.</th><th class="num">Valor C$</th><th></th></tr></thead>
        <tbody>${filas.map(r => `<tr class="clic" onclick="location.hash='kardex/${r.p.id}'"><td>${esc(r.p.codigo)}</td><td>${esc(r.p.nombre)}</td><td>${esc(codUnidad(r.p.unidad_id))}</td>
          ${r.porB.map(x => `<td class="num">${x ? fmtQ(x) : '<span class="muted">–</span>'}</td>`).join('')}
          <td class="num"><b>${fmtQ(r.total)}</b></td><td class="num">${fmt(r.p.costo_promedio)}</td><td class="num">${fmt(r.valor)}</td>
          <td>${r.bajo ? '<span class="etiqueta e-borrador">Bajo mínimo</span>' : ''}</td></tr>`).join('') || `<tr><td colspan="${bods.length + 7}" class="vacio">No hay productos con estos filtros.${puede('inventario.catalogo') && !cache.productos.length ? ' <a href="#productos">Cree el primer producto</a>.' : ''}</td></tr>`}
          ${filas.length ? `<tr class="total"><td colspan="${bods.length + 5}">Valor total</td><td></td><td class="num">${fmt(totV)}</td><td></td></tr>` : ''}</tbody>
      </table></div>
    </div>`;
  $('#f-ex').onsubmit = e => { e.preventDefault(); const d = new FormData(e.target); filtroExist = { texto: d.get('texto'), categoria: d.get('categoria'), bajos: d.get('bajos') === 'on', ceros: d.get('ceros') === 'on' }; vExistencias(m); };
  $('#b-csv').onclick = () => csv(`existencias_${hoy()}.csv`, [['Codigo', 'Producto', 'Unidad', ...bods.map(b => b.nombre), 'Total', 'Costo promedio', 'Valor C$'],
    ...filas.map(r => [r.p.codigo, r.p.nombre, codUnidad(r.p.unidad_id), ...r.porB, r.total, r.p.costo_promedio, r.valor.toFixed(2)])]);
}
